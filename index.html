<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Corea 2026 · giorno per giorno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16302B">
<style>
:root{
  color-scheme: light only;
  --display:"Gowun Batang", Georgia, serif;
  --body:"IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;

  /* superfici */
  --paper:#FFFFFF;
  --surface:#F2F6F1;
  --card:#FAFCF9;
  --line:#DCE3DC;
  --line-strong:#B6C2BB;

  /* testo */
  --text:#14191B;
  --head:#16302B;
  --muted:#4C5A56;

  /* accenti */
  --jade:#136E5E;
  --gold:#7A5B17;
  --red:#9C2E22;
  --slate:#2F5A52;
  --accent:var(--jade);
  --dot:#2E8C77;

  /* pastiglie */
  --chip-b-bg:#DFF0EB; --chip-b-fg:#0F5C4E; --chip-b-bd:#B5D8CF;
  --chip-g-bg:#F8F0D9; --chip-g-fg:#6B4F11; --chip-g-bd:#E3D2A6;
  --note-bg:#FBF4E2; --note-bd:#C79A2E;
  --warn-bg:#FBEDEA; --warn-bd:#C0483A;
}
.t-jade{--accent:var(--jade); --dot:var(--dot)}
.t-gold{--accent:var(--gold); --dot:var(--gold)}
.t-red{--accent:var(--red); --dot:var(--red)}
.t-slate{--accent:var(--slate); --dot:var(--slate)}

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:74px; background:#FFFFFF !important; color-scheme:light only}
.sheet{background:#FFFFFF !important; color:#14191B !important; min-height:100vh; position:relative; z-index:0}
main.wrap{background:#FFFFFF !important}
section{background:#FFFFFF !important}
section.city{background:#FFFFFF !important}
.body{background:var(--card) !important}
details.day{background:var(--card) !important}
body{
  margin:0; background:#FFFFFF !important; color:#14191B !important; color-scheme:light only;
  font-family:var(--body); font-weight:400; font-size:17.5px; line-height:1.68;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px; margin:0 auto; padding:0 20px}

/* striscia dancheong: i cinque colori delle travi dei templi */
.dancheong{height:5px; display:flex; width:100%}
.dancheong i{flex:1}
.dancheong i:nth-child(1){background:#D0523F}
.dancheong i:nth-child(2){background:#3E9A86}
.dancheong i:nth-child(3){background:#D2A63C}
.dancheong i:nth-child(4){background:#4E7A70}
.dancheong i:nth-child(5){background:#D9CFA8}

/* testata */
.hero{background:var(--surface); color:var(--text); padding:52px 0 40px; position:relative; overflow:hidden; border-bottom:1px solid var(--line)}
.hero::after{
  content:"韓"; position:absolute; right:-30px; top:-40px;
  font-family:var(--display); font-size:280px; line-height:1; color:var(--accent); opacity:.07; pointer-events:none;
}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:600}
.hero h1{font-family:var(--display); font-weight:700; font-size:clamp(38px,8vw,66px); line-height:1.04; margin:16px 0 6px; letter-spacing:-.01em; color:var(--head)}
.hero .han{font-family:var(--display); font-size:clamp(18px,3.6vw,26px); color:var(--accent); margin:0 0 22px}
.hero .lede{max-width:56ch; color:var(--muted); font-size:17.5px; margin:0 0 30px}

.route{display:flex; flex-wrap:wrap; gap:0; border-top:1px solid var(--line-strong); padding-top:20px}
.stop{flex:1 1 120px; padding-right:14px}
.stop::before{content:""; display:block; width:11px; height:11px; border-radius:50%; margin-bottom:12px; background:var(--dot)}
.stop .n{font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase}
.stop .p{font-family:var(--display); font-size:22px; color:var(--head); margin:2px 0 0}
.stop .d{font-size:13.5px; color:var(--muted)}

/* barra di navigazione */
nav.bar{position:sticky; top:0; z-index:40; background:var(--paper); border-bottom:1px solid var(--line)}
.bar .wrap{display:flex; align-items:center; gap:6px; overflow-x:auto; padding-top:9px; padding-bottom:9px; scrollbar-width:none}
.bar .wrap::-webkit-scrollbar{display:none}
.bar a{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text); text-decoration:none; padding:6px 9px; border-radius:3px; white-space:nowrap; font-weight:500}
.bar a:hover,.bar a:focus-visible{color:var(--jade); background:var(--surface)}
.bar button{margin-left:auto; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; background:var(--surface); border:1px solid var(--line-strong); color:var(--text); padding:6px 11px; border-radius:3px; cursor:pointer; white-space:nowrap; font-weight:500}
.bar button:hover{border-color:var(--jade); color:var(--jade)}

section{padding:52px 0 8px}
h2{font-family:var(--display); font-weight:700; font-size:clamp(26px,4.6vw,36px); line-height:1.16; margin:0 0 6px; color:var(--head)}
h2 .num{font-family:var(--mono); font-size:13px; letter-spacing:.14em; color:var(--accent); display:block; margin-bottom:10px; font-weight:600}
h3{font-family:var(--body); font-weight:600; font-size:18px; margin:26px 0 8px; color:var(--head)}
p{margin:0 0 14px}
.sub{color:var(--muted); font-size:16px; margin-bottom:26px; max-width:62ch}
code{font-family:var(--mono); font-size:.9em; background:var(--surface); padding:1px 5px; border-radius:3px}

/* link ai luoghi */
.l{color:var(--accent); font-weight:600; text-decoration:none; border-bottom:1.5px solid currentColor; border-bottom-color:color-mix(in srgb, currentColor 42%, transparent); transition:border-color .15s, background .15s; padding-bottom:1px}
.l:hover,.l:focus-visible{border-bottom-color:currentColor; background:color-mix(in srgb, currentColor 12%, transparent)}
.l-site::after{content:"↗"; font-size:.7em; vertical-align:super; margin-left:2px}

/* intestazione di tappa */
.city{margin-top:56px; border-top:1px solid var(--line); padding-top:30px}
.city .dancheong{margin-bottom:26px}
.city-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.city-head .kr{font-family:var(--display); font-size:30px; color:var(--accent)}
.city-head h2{margin-bottom:0}

/* scheda giornata */
details.day{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:2px; margin:14px 0; overflow:hidden}
details.day > summary{list-style:none; cursor:pointer; padding:18px 20px; display:flex; gap:16px; align-items:flex-start}
details.day > summary::-webkit-details-marker{display:none}
details.day > summary:hover{background:var(--surface)}
.daynum{font-family:var(--mono); font-size:12.5px; font-weight:600; letter-spacing:.04em; color:var(--accent); border:1px solid currentColor; border-radius:2px; padding:3px 6px; flex:none; margin-top:3px}
.daymeta{flex:1; min-width:0}
.daydate{font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:500}
.daytitle{font-family:var(--display); font-size:22px; line-height:1.25; color:var(--head); margin-top:3px}
.chev{flex:none; color:var(--muted); font-size:13px; margin-top:8px; transition:transform .2s}
details.day[open] .chev{transform:rotate(90deg)}
.body{padding:0 20px 22px; border-top:1px solid var(--line)}

.blk{margin-top:20px}
.blk > .lab{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:6px; font-weight:600}
.blk p:last-child{margin-bottom:0}
.blk ul{margin:0 0 12px; padding-left:20px}
.blk li{margin-bottom:6px}
.blk li:last-child{margin-bottom:0}

/* hotel affiancati */
.split{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px}
@media(max-width:640px){.split{grid-template-columns:1fr}}
.nuc{background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:14px 15px}
.nuc .who{font-family:var(--mono); font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; font-weight:600}
.nuc .name{font-weight:600; font-size:17px; line-height:1.3; margin-bottom:4px; color:var(--head)}
.nuc .prog{display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px; border-radius:2px; margin-bottom:8px; font-weight:600}
.prog.bonvoy{background:var(--chip-b-bg); color:var(--chip-b-fg); border:1px solid var(--chip-b-bd)}
.prog.genius{background:var(--chip-g-bg); color:var(--chip-g-fg); border:1px solid var(--chip-g-bd)}
.nuc p{font-size:15.5px; color:var(--text); margin:0}

/* richiami */
.note{border-left:3px solid var(--note-bd); background:var(--note-bg); padding:13px 16px; margin:16px 0; font-size:16px; color:var(--text)}
.warn{border-left:3px solid var(--warn-bd); background:var(--warn-bg); padding:13px 16px; margin:16px 0; font-size:16px; color:var(--text)}
.note p:last-child,.warn p:last-child{margin-bottom:0}

/* tabelle */
.tbl{width:100%; border-collapse:collapse; margin:18px 0; font-size:15.5px; color:var(--text)}
.tbl th{text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:2px solid var(--line-strong)}
.tbl td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .soft{color:var(--muted)}
.tbl td.n, .tbl th.n{text-align:right; white-space:nowrap; font-family:var(--mono); font-size:14.5px}
.tbl tr.tot td{border-top:2px solid var(--line-strong); font-weight:700; background:var(--surface)}
.tbl tr.sec td{background:var(--surface); font-family:var(--mono); font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); font-weight:600}
.grand{border:2px solid var(--accent); background:var(--surface); padding:18px 20px; border-radius:2px; margin:22px 0}
.grand .row{display:flex; justify-content:space-between; gap:16px; padding:7px 0; border-bottom:1px solid var(--line)}
.grand .row:last-child{border-bottom:none}
.grand .row.big{font-size:19px; font-weight:700; color:var(--head); border-top:2px solid var(--line-strong); margin-top:6px; padding-top:12px}
.grand .row span:last-child{font-family:var(--mono); white-space:nowrap}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
.scroll .tbl{min-width:600px}
.ok{color:var(--jade); font-weight:700}

.legend{font-size:15px; color:var(--text); border:1px dashed var(--line-strong); background:var(--surface); padding:12px 15px; border-radius:2px; margin:22px 0}

footer{background:var(--surface); color:var(--muted); margin-top:70px; padding:36px 0; font-size:14.5px; border-top:1px solid var(--line)}
footer .wrap{max-width:860px}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px}



/* sintesi: card, elenco giornate, to-do numerata */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface) !important; border:1px solid var(--line); border-radius:2px; padding:15px 16px}
.card .k{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:5px}
.card .v{font-family:var(--display); font-size:22px; color:var(--head); line-height:1.2; margin-bottom:6px}
.card p{font-size:15px; color:var(--muted); margin:0}
.days{list-style:none; padding:0; margin:18px 0}
.days li{display:flex; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); margin:0}
.days li:last-child{border-bottom:none}
.days .d{font-family:var(--mono); font-size:12.5px; color:var(--accent); font-weight:600; flex:none; width:76px; padding-top:3px}
.days .t{flex:1}
.days .t b{display:block; color:var(--head); font-weight:600}
.days .t span{font-size:15.5px; color:var(--muted)}
.days .who{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); font-weight:600}
.todo{counter-reset:step; list-style:none; padding:0; margin:18px 0}
.todo li{position:relative; padding-left:42px; margin-bottom:14px}
.todo li::before{counter-increment:step; content:counter(step); position:absolute; left:0; top:1px;
  font-family:var(--mono); font-size:12.5px; font-weight:700; color:#fff; background:var(--accent);
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center}

/* sorpresa: testo sfocato, si rivela al tocco */
.sp{filter:blur(7px); cursor:pointer; user-select:none; -webkit-user-select:none; transition:filter .25s; border-radius:3px}
.sp:hover{filter:blur(5px)}
.sp.on, body.reveal .sp{filter:none; user-select:auto; -webkit-user-select:auto}
.spblk{position:relative; padding-top:26px}
.spblk::before{content:"🎁 sorpresa · tocca per rivelare"; position:absolute; left:0; top:0; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600}
.spblk.on::before, body.reveal .spblk::before{content:"🎁 sorpresa · tocca per nascondere"}
.sp-tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-right:6px}
body.reveal .sp-tag::after{content:" (visibile)"}
@media print{.sp{filter:blur(7px) !important}}
/* mini-mappa giornaliera */
.mapwrap{margin:20px 0 4px; border:1px solid var(--line); border-radius:3px; background:#F4F7F3 !important; padding:10px 10px 6px; overflow-x:auto}
.mapsvg{display:block; width:100%; min-width:520px; height:auto}
.mapcap{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:6px 2px 0; font-weight:600}
/* ancoraggio anti-tema-scuro: ogni superficie dichiara il proprio bianco */
.hero, footer, .nuc, .legend, .tbl tr.sec td, .tbl tr.tot td, .grand{background-color:#F2F6F1 !important}
nav.bar{background-color:#FFFFFF !important}
details.day, .body{background-color:#FAFCF9 !important}
.note{background-color:#FBF4E2 !important}
.warn{background-color:#FBEDEA !important}
.prog.bonvoy{background-color:#DFF0EB !important}
.prog.genius{background-color:#F8F0D9 !important}
.tbl, .tbl td, .tbl th, p, li, td, th, h1, h2, h3, summary, div, span{-webkit-text-fill-color:currentColor}
@media (prefers-reduced-motion:reduce){*{transition:none!important; scroll-behavior:auto!important}}
@media print{
  nav.bar{display:none} .hero::after{display:none}
  body{background:#fff; color:#000; font-size:11pt}
  details.day{break-inside:avoid; background:#fff}
}

/* ===== APP ===== */
body{font-size:16.5px}
.app-top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.app-top .row{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.app-top .acts{display:flex;gap:6px;margin-left:auto}
.app-top .brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--head);white-space:nowrap}
.app-top .brand small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--jade);display:block;font-weight:600}
.app-top .clock{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}
.app-top .clock b{display:block;color:var(--head);font-size:15px}
@media(max-width:560px){.app-top .acts{flex-basis:100%;margin-left:0;justify-content:flex-end}}
@media(max-width:430px){.app-top .row{gap:8px;padding:8px 12px} .app-top .brand{font-size:17px} .app-top .clock{font-size:10.5px} .app-top .clock b{font-size:13px} .app-top button{padding:5px 7px;font-size:11px}}
.app-top button{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line-strong);color:var(--text);padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.strip{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:var(--hdr,57px);z-index:49}
.strip .row{max-width:860px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.strip .row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 6px 5px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);text-decoration:none;line-height:1.1}
.chip .w{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip .n{font-family:var(--display);font-size:20px;font-weight:700;color:var(--head);margin:2px 0}
.chip .c{font-size:10px;color:var(--muted)}
.chip.jade{border-bottom:3px solid var(--jade)} .chip.gold{border-bottom:3px solid var(--gold)} .chip.red{border-bottom:3px solid var(--red)}
.chip.sel{background:var(--head);border-color:var(--head)} .chip.sel .n,.chip.sel .w,.chip.sel .c{color:#fff}
.chip.today{box-shadow:0 0 0 2px #D2A63C}
.chip.past{opacity:.55}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .row{max-width:860px;margin:0 auto;display:flex}
.tabs a{flex:1;text-align:center;padding:9px 2px 8px;text-decoration:none;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.tabs a span{display:block;font-size:18px;font-family:var(--body);margin-bottom:2px}
.tabs a.sel{color:var(--jade);font-weight:600;border-top:2px solid var(--jade);margin-top:-1px}
main.view{max-width:860px;margin:0 auto;padding:14px 16px 90px}
.dayhead{margin:6px 0 12px}
.dayhead .rel{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:4px;background:#F8F0D9;color:#6B4F11;margin-bottom:8px}
.dayhead .rel.today{background:var(--head);color:#fff}
.dayhead .dt{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dayhead h1{font-family:var(--display);font-size:clamp(24px,5.6vw,34px);line-height:1.15;margin:4px 0 6px;color:var(--head)}
.dayhead .flag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--red);font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
@media(max-width:560px){.quick{grid-template-columns:1fr}}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.qbox .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.qbox .h{font-size:14.5px;margin:2px 0}
.qbox .h b{color:var(--head)}
.lnks{display:flex;flex-wrap:wrap;gap:6px}
.lnks a{font-size:13px;background:#fff;border:1px solid var(--line-strong);color:var(--jade);text-decoration:none;padding:4px 9px;border-radius:999px;font-weight:600}
.lnks a.site{border-style:dashed}
.lnks a::before{content:"📍 ";font-size:11px} .lnks a.site::before{content:"🌐 "}
main.view details.day{margin:0}
main.view details.day summary{display:none}
main.view details.day .body{padding-top:14px}
.pager{display:flex;justify-content:space-between;gap:10px;margin:22px 0 10px}
.pager a{flex:1;text-decoration:none;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;color:var(--head);background:var(--card);font-size:14px}
.pager a small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pager a.next{text-align:right}
.countdown{background:var(--head);color:#fff;border-radius:10px;padding:16px 18px;margin:0 0 16px}
.countdown b{font-family:var(--display);font-size:34px;display:block;line-height:1}
.countdown p{margin:6px 0 0;color:#D9E6E2;font-size:14.5px}
.countdown a{color:#fff}
.panel h2{font-size:clamp(22px,4.6vw,30px)}
.panel section{padding:10px 0 0}
.panel .city{margin-top:30px;padding-top:18px}

  <h3>Documenti e ingresso</h3>
  <p><strong>K-ETA: non serve.</strong> L'esenzione per i cittadini italiani è prorogata fino al <strong>31 dicembre 2026</strong>; ingresso senza visto fino a 90 giorni.</p>
  <div class="warn"><p><strong>e-Arrival Card: attenzione.</strong> Dal 2026 la dichiarazione di arrivo digitale è richiesta a chi <em>non</em> possiede un K-ETA valido. Due strade: compilare l'e-Arrival Card online nei giorni precedenti la partenza (una per viaggiatore, quella della bimba a cura di un genitore), oppure richiedere volontariamente il <a class="l l-site" href="https://www.k-eta.go.kr/" target="_blank" rel="noopener">K-ETA</a> (≈10.000 KRW, valido 3 anni) che esonera dalla dichiarazione e apre i gate automatici. <strong>Consiglio: e-Arrival Card online, gratuita.</strong></p></div>
  <p>Passaporti con validità residua di almeno 6 mesi. Passaporto individuale anche per la bimba.</p>

  <h3>Fuso orario · il dettaglio che quasi tutti sbagliano</h3>
  <ul>
    <li>Dal 15 al 24 ottobre: <strong>Corea = Italia + 7 ore</strong>.</li>
    <li>Nella notte tra sabato 24 e <strong>domenica 25 ottobre finisce l'ora legale in Italia</strong>: da quel momento <strong>Corea = Italia + 8 ore</strong>. Riprogrammate videochiamate e sveglie.</li>
  </ul>

  <h3>Il kit “bimba di 18 mesi”</h3>
  <ul>
    <li><strong>Il principio di questo viaggio: si fa quello che si vuole fare.</strong> La bimba dorme nel passeggino mentre si cammina, e dove il passeggino non passa si mette il marsupio e si sale lo stesso. <strong>Nessuna attrazione è stata esclusa dal programma per motivi di accessibilità</strong>, e non ci sono rientri obbligati a metà giornata. Le indicazioni sul passeggino che trovate ogni giorno servono solo a farvi sapere <em>cosa portare</em>, non a decidere dove andare.</li>
    <li><strong>Passeggino a ruote grandi</strong>: la Corea è ottima sui marciapiedi, ma i cortili dei palazzi reali e i complessi di Gyeongju sono in ghiaia fine.</li>
    <li><strong>Marsupio ergonomico da schiena</strong>: è lo strumento chiave, non l'accessorio di riserva. Serve a Bulguksa, Seokguram, Haedong Yonggungsa, Gamcheon, Bukchon e nei vicoli di Gwangjang e Jagalchi. Con una bimba di 18 mesi e un adulto allenato, i 108 gradini di Yonggungsa o le rampe di Gamcheon sono un'ora di camminata, non un'impresa.</li>
    <li><strong>La strategia dei due mezzi</strong>: passeggino nel bagagliaio del taxi o al deposito bagagli del sito, marsupio addosso. Nei giorni misti — Gyeongju giorno 7, Busan giorni 11 e 12 — portate entrambi e cambiate a metà giornata.</li>
    <li><strong>Seggiolino auto</strong>: i taxi coreani in genere non lo montano. Richiedetelo al transfer privato e insistete per i tragitti extraurbani.</li>
    <li><strong>Nursing room (수유실)</strong>: in tutti i grandi magazzini, nelle stazioni KTX e negli aeroporti, con fasciatoio, microonde e scaldabiberon. Standard che in Europa non esiste.</li>
    <li>Pannolini, latte formulato e omogeneizzati si trovano ovunque (Olive Young, Emart, CU, GS25): <strong>non servono scorte per 14 giorni</strong>.</li>
    <li>Meteo: Seul 10–21 °C, Busan 14–23 °C, Gyeongju escursione più marcata. Sere fresche: strati, non cappotti.</li>
  </ul>

nt-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Cheonggyecheon</text><circle cx=\"254.4\" cy=\"163.6\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"254.4\" y=\"167.2\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">5</text><text x=\"267.4\" y=\"167.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Night market</text></svg><div class=\"mapcap\">Itinerario del giorno · Seoul</div></div></div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina</span>\n        <ul>\n          <li><strong>10:55</strong> — Atterraggio a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Incheon+International+Airport+Terminal+1\" target=\"_blank\" rel=\"noopener\">Incheon Terminal 1</a> (da confermare al check-in). Con l'e-Arrival Card già compilata, immigrazione e bagagli in 45–60 minuti.</li>\n          <li><strong>In aeroporto</strong>: eSIM già installata da casa, si accende e basta. Fermata allo <strong>SKT Roaming Center</strong> (T1, piano arrivi, fra le uscite 6 e 7, aperto 24 ore) per <strong>ritirare la T-money gratuita</strong> con il voucher Klook, poi prima ricarica di 20.000–30.000 won al distributore della metropolitana o in un convenience store (solo contanti). Venti minuti, non di più.</li>\n          <li><strong>~11:45</strong> — <strong>Transfer privato Klook prenotato ✓</strong> (booking <strong>QHH514102</strong>, operatore Car Rental Car, van Staria/Carnival, 83,77 € pagati): <strong>meet &amp; greet</strong> con cartello al nome nella hall arrivi del Terminal 1, <strong>seggiolino</strong> per la bimba a bordo, 90 minuti di attesa gratuita dall'atterraggio reale. Contatto autista/operatore: WhatsApp e telefono <strong>+82 10 9286 9328</strong>. Circa 70 minuti fino al Courtyard.</li>\n        </ul>\n        <div class=\"note\" style=\"display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap\"><div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAIAAADTED8xAAAACXBIWXMAAAsSAAALEgHS3X78AAADbElEQVR42u3dS27DMAxAwajQ/a+cLrrJJp8yNE3JMwdoVaEPCkLIHvf7/QZX9WMLEAAIAAQAAgABgABAACAAEAAIAAQAAgABgABAACAAEAAIAAQAAgABgABAACAAEAAIAAQAAgABgABAACAAEAAIAPLNyl82xlh0m569SS32F5W9l22/DXcCgABAACAAEAAIAAQAAoCPzSbrKBt8vBAYG8WWnT6fCixj0Q13AoAAQAAgABAACAAEAP8zm6+vw1fmlSvf8uv5Dn+UEwAEAAIAAYAAEIAtQAAgALieaQu+UXml48Xv6jxpcgKAAEAAIAAQAAgABAACgJMYhB3lxXBq3TcXOQFAACAAEAAIAAQAAgABwDq6D8Kudtepw7WvS+25EwAfgUAAIAAQAAgABAACgH11GYS5JPUndo8sMLqy4U4AEAACAAGAAEAAIAAQAOyudBDmVVZv5c6nbLgTAAQAAgABgABAACAArm5UflVc9tiz2C8quyOSfuulw+2W3Es5Zf+WTgB8BAIBgABAACAAEAAIAPbV5ULMs5lI5cwod9KUPsrpMEbssDwnAAgABAACAAGAAEAAIAD4zFx36bHxSodpV2zSlDtGrNxzJwAIAAQAAgABgABAACAAOMNoMtro8FjCdZcXWHb6gxY7zOmcACAAEAAIAAQAAgABgADgQemNsHUf7pe77LLlpf+05u8pcwKAAEAAIAAQAAgABAACgAdjv4fdlW5f9vRnv0nTzTvCQAAgABAACAAEAAKAE3W5ENNc82lJYHnpD40rW4MTAAQAAgABgABAACAAEAB8ZjZZR4dJU+6T4To8/q1sH2I/0CuSQAAgABAACAAEAAIAAcCRZvP1VT56rWx56VeuysZnuWtwIwx8BAIBgABAACAAEAAIAI40bcE3KodTZWOjyumeEwAEAAIAAYAAQAAgABAAHMYg7Cjpd5pyX8IVkz4jcwKAAEAAIAAQAAgABAACgMN0H4R1nqGEpd/tyn27WdnKPRoRfAQCAYAAQAAgABAAHK7LHKDzw8Niy07/Jrtsi5pco3ECgABAACAAEAAIAAQAAoDvjC1vnIATAAQAAgABgABAACAAEAACsAUIAAQAAgABgABAACAAEAAIAAQAAgABgABAACAAEAAIAAQAAgABgABAACAAEAAIAE72C+Hi7B35/tYBAAAAAElFTkSuQmCC\" alt=\"QR voucher Klook\" width=\"150\" height=\"150\" style=\"display:block;border:1px solid var(--line);border-radius:4px;background:#fff;image-rendering:pixelated\"></div><div style=\"flex:1;min-width:220px\"><p><strong>Appena atterrati: chiedere la T-money.</strong> Allo <strong>SKT Roaming Center</strong> (T1 arrivi, fra le uscite 6 e 7, aperto 24 ore) mostrate questo <strong>voucher Klook</strong>: prenotazione <strong>FVZ641234</strong>, voucher <strong>KLK2367158596</strong>, intestato a Fabio Massimo Molinari, pick-up 15 ottobre, 2 eSIM. Vi consegnano <strong>due T-money gratuite</strong> (una per eSIM). Questo QR serve <em>solo</em> al banco: non è la eSIM, che si installa dal PDF arrivato per mail da kbooks-global@usimkorea.kr.</p></div></div>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 13:45</span>\n        <p><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Myeongdong+Gyoja+Main+Branch+Seoul\" target=\"_blank\" rel=\"noopener\">Myeongdong Gyoja</a>, 6 minuti a piedi. Istituzione dal 1966, Bib Gourmand. <strong>Piatto tipico: <em>kalguksu</em></strong>, tagliatelle di grano tirate a mano in brodo denso di pollo, con mandu al vapore. Caldo, non piccante, e la bimba mangia i noodles senza problemi. Locale rumoroso e veloce, con seggioloni.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio</span>\n        <p><strong>15:00 — l'unica pausa davvero programmata di tutto il viaggio</strong>, e non è per la bimba: è per il fuso. Chi ha dormito in aereo esce subito, chi non ha chiuso occhio va in piscina o in palestra (il modo migliore per resettare il ritmo circadiano). <strong>Nessuno dorme oltre le 17:00</strong>, altrimenti la notte è compromessa.</p>\n        <p><strong>Per chi esce</strong>: <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Deoksugung+Palace+Seoul\" target=\"_blank\" rel=\"noopener\">Deoksugung</a> è a 8 minuti a piedi e il viale di aceri <strong>Doldam-gil</strong> è la prima immagine autunnale di Seul; <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Namdaemun+Market+Seoul\" target=\"_blank\" rel=\"noopener\">Namdaemun Market</a> è a 7 minuti, tutto in piano e coperto. La bimba dorme nel passeggino mentre camminate.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata</span>\n        <ul>\n          <li><strong>17:30</strong> — Passeggiata sul <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Cheonggye+Plaza+Cheonggyecheon+Seoul\" target=\"_blank\" rel=\"noopener\">Cheonggyecheon</a> dalla <strong>Cheonggye Plaza</strong>, l'unico accesso con rampa comoda: da lì si cammina su lastricato piano per 1,5 km fino al ponte Gwangtonggyo, con i getti d'acqua illuminati al tramonto.</li>\n          <li><strong>19:00</strong> — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Myeongdong+Night+Street+Food+Market+Seoul\" target=\"_blank\" rel=\"noopener\">Myeongdong Night Market</a>: <em>tornado potato</em>, <em>gyeran-ppang</em> (pane all'uovo, ideale per la bimba), <em>tteokbokki</em>, aragostina alla griglia con formaggio, <em>hotteok</em>. Cena in piedi, all'orientale.</li>\n          <li><strong>21:00</strong> — Tutti a letto.</li>\n        </ul>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>Myeongdong la sera è piana ma affollatissima: tenete il passeggino sul lato delle vetrine, non al centro della via.</li>\n          <li>Fate partire il primo carico in lavanderia stasera: arriverete a Gyeongju con tutto pulito.</li>\n          <li><strong>Non</strong> programmate nulla per domattina prima delle 9:30.</li>\n        </ul>\n      </div>\n    ", "links": [{"t": "Incheon Terminal 1", "h": "https://www.google.com/maps/search/?api=1&amp;query=Incheon+International+Airport+Terminal+1", "site": false}, {"t": "Myeongdong Gyoja", "h": "https://www.google.com/maps/search/?api=1&amp;query=Myeongdong+Gyoja+Main+Branch+Seoul", "site": false}, {"t": "Deoksugung", "h": "https://www.google.com/maps/search/?api=1&amp;query=Deoksugung+Palace+Seoul", "site": false}, {"t": "Namdaemun Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Namdaemun+Market+Seoul", "site": false}, {"t": "Cheonggyecheon", "h": "https://www.google.com/maps/search/?api=1&amp;query=Cheonggye+Plaza+Cheonggyecheon+Seoul", "site": false}, {"t": "Myeongdong Night Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Myeongdong+Night+Street+Food+Market+Seoul", "site": false}], "hotels": [["Nucleo 1", "Courtyard Myeongdong · conf. 88806376", "https://www.google.com/maps/search/?api=1&query=Courtyard+by+Marriott+Seoul+Myeongdong"], ["Nucleo 2", "in volo · FCO → ICN (22:15 del 16)", null]]}, {"id": "02", "iso": "2026-10-16", "date": "Venerdì 16 ottobre", "title": "Il palazzo di pietra, il viale dei ginkgo e il villaggio hanok sotto Namsan — a mezzanotte arrivano gli altri", "flag": "SOLO NUCLEO 1", "acc": "jade", "sec": "seul", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 420\" role=\"img\" aria-label=\"Itinerario del giorno 02\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"420\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><text x=\"566\" y=\"408\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">JUNG-GU · ZOOM</text><circle cx=\"123.2\" cy=\"341.9\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"129.2\" y=\"345.4\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seoul Station</text><circle cx=\"339.5\" cy=\"183.3\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"345.5\" y=\"186.8\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Myeongdong</text><circle cx=\"291.4\" cy=\"306.3\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"297.4\" y=\"309.8\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Funivia Namsan</text><path d=\"M 226.4,268.8 L 185.4,144.0 L 148.7,131.5 L 225.0,135.1 L 308.4,183.3 L 219.3,259.9 L 456.8,258.1 L 226.4,78.1\" fill=\"none\" stroke=\"#136E5E\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"226.4\" cy=\"268.8\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"226.4\" y=\"272.40000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"213.4\" y=\"272.8\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Courtyard · 11:00</text><circle cx=\"185.4\" cy=\"144.0\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"185.4\" y=\"147.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"172.4\" y=\"148.0\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Deoksugung · 11:10</text><circle cx=\"148.7\" cy=\"131.5\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"148.7\" y=\"135.1\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"148.7\" y=\"119.5\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Doldam-gil · 12:00</text><circle cx=\"225.0\" cy=\"135.1\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"225.0\" y=\"138.7\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"238.0\" y=\"139.1\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Jeongdong-gil · City Hall</text><circle cx=\"308.4\" cy=\"183.3\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"308.4\" y=\"186.9\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">5</text><text x=\"321.4\" y=\"187.3\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Hadongkwan · 12:45</text><circle cx=\"219.3\" cy=\"259.9\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"219.3\" y=\"263.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">6</text><text x=\"232.3\" y=\"279.9\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Namdaemun · 15:30</text><circle cx=\"456.8\" cy=\"258.1\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"456.8\" y=\"261.70000000000005\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">7</text><text x=\"456.8\" y=\"246.10000000000002\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Namsangol · 16:15</text><circle cx=\"226.4\" cy=\"78.1\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"226.4\" y=\"81.69999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">8</text><text x=\"239.4\" y=\"82.1\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Cheonggyecheon · 17:30</text></svg><div class=\"mapcap\">Itinerario del giorno · Seoul</div></div>\n      <div class=\"note\"><p><strong>Programma rifatto la mattina stessa</strong>: la sveglia è andata lunga per il fuso, il cielo è sereno, quindi niente museo. Si recupera all'aperto quello che ieri è saltato: un anello di circa 4 km tutto in piano, a piedi dall'hotel, con il pranzo a tre minuti dalla camera per la pausa del pomeriggio. Il Museo Nazionale lo recuperiamo in un pomeriggio di pioggia, se mai ci sarà.</p></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · dalle 11:00 · il palazzo e il viale</span>\n        <ul>\n          <li><strong>11:00</strong> — Si esce dal Courtyard e si va a nord su Namdaemun-ro, poi a sinistra su Sejong-daero: <strong>8 minuti</strong> fino al portone Daehanmun.</li>\n          <li><strong>11:10 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Deoksugung+Palace+Seoul\" target=\"_blank\" rel=\"noopener\">DEOKSUGUNG</a></strong> (덕수궁), ingresso 1.000 won. È il più piccolo dei palazzi reali e il più strano: i padiglioni di legno dell'ultimo re Joseon accanto a <strong>Seokjojeon</strong>, il palazzo neoclassico di pietra con il giardino alla francese e la fontana, costruito nel 1910 dall'impero che stava finendo. Giro ad anello in senso orario: Junghwajeon (la sala del trono), lo stagno, Seokjojeon, e si torna al portone. Quaranta minuti, tutto in piano, passeggino ovunque. Il <strong>cambio della guardia</strong> davanti a Daehanmun è alle <strong>14:00</strong> (e alle 11:00, che perderete): se volete vederlo, dura 20 minuti, e si può rientrare dopo pranzo apposta.</li>\n          <li><strong>12:00 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Deoksugung+Doldam-gil+Seoul\" target=\"_blank\" rel=\"noopener\">DOLDAM-GIL</a></strong> (덕수궁 돌담길): dal portone si gira a destra e si costeggia il muro di pietra del palazzo. Sono 400 metri di ginkgo e aceri, con le panchine, la prima cartolina d'autunno di Seul; a metà ottobre i ginkgo cominciano a ingiallire. In fondo si piega a destra in <strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Jeongdong-gil+Seoul\" target=\"_blank\" rel=\"noopener\">Jeongdong-gil</a></strong>: la chiesa anglicana, il teatro Jeongdong, le ex legazioni, poi si sbuca sulla piazza di <strong>City Hall</strong> con il municipio di vetro che si piega sopra quello vecchio. Venti minuti di passeggiata.</li>\n        </ul>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 12:45 · Hadongkwan</span>\n        <p>Da City Hall si rientra verso Myeongdong per Eulji-ro, <strong>10 minuti</strong>: <strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hadongkwan+Myeongdong+Seoul\" target=\"_blank\" rel=\"noopener\">HADONGKWAN</a></strong> (하동관, Myeongdong 9-gil 12), dal 1939, Bib Gourmand. Un piatto solo: il <strong><em>gomtang</em></strong>, brodo chiaro di manzo con il riso già dentro, fette di carne tenera, cipollotto a parte. Niente peperoncino, si sala al tavolo: per la bimba è una minestra perfetta, e la porzione \"small\" basta a lei e a metà di uno di voi. 15–17.000 won, si mangia in venti minuti, chiude alle 16:00. Mostrate <strong>하동관</strong>. Da lì il Courtyard è a <strong>3 minuti</strong>: pausa in camera fino alle 15:30, la bimba dorme, voi anche.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio · dalle 15:30 · mercato e hanok</span>\n        <ul>\n          <li><strong>15:30 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Namdaemun+Market+Seoul\" target=\"_blank\" rel=\"noopener\">NAMDAEMUN MARKET</a></strong> (남대문시장), 5 minuti dall'hotel, il mercato più antico della città: arcate coperte e in piano, il vicolo del <em>kalguksu</em>, le bancarelle di <em>hotteok</em>, gli occhiali e le valigie. Mezz'ora, col passeggino sulle vie principali. Se la pausa ha funzionato e avete gambe, saltatelo e andate dritti al punto dopo.</li>\n          <li><strong>16:15 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Namsangol+Hanok+Village+Seoul\" target=\"_blank\" rel=\"noopener\">NAMSANGOL HANOK VILLAGE</a></strong> (남산골한옥마을), 15 minuti a piedi lungo Toegye-ro (o 5 di taxi): cinque case nobiliari dell'epoca Joseon trasferite qui ai piedi di Namsan, con il giardino, lo stagno e il padiglione; ingresso libero, aperto fino alle 21, passeggino ovunque. Verso le 16:30 la luce è bassa e dorata sui tetti e c'è pochissima gente. Dal fondo del giardino parte il <strong>Namsan Dulle-gil</strong>, la passerella in legno in piano che gira intorno alla montagna sotto gli aceri: fatene dieci minuti e tornate, la torre resta per domenica.</li>\n        </ul>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata</span>\n        <p><strong>17:30</strong> — Taxi (8 minuti) o a piedi (20) fino a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Cheonggye+Plaza+Cheonggyecheon+Seoul\" target=\"_blank\" rel=\"noopener\">Cheonggye Plaza</a>: la passeggiata sul <strong>Cheonggyecheon</strong>, 1,5 km in piano sul lastricato lungo l'acqua fino al ponte Gwangtonggyo, con i getti illuminati al tramonto (18:00). Poi cena presto a Myeongdong: <strong>Myeongdong Night Market</strong> in piedi (gyeran-ppang per la bimba, hotteok, tteokbokki), o un tavolo vero da Taecho Galbi se ieri non ci siete andati. <strong>A letto per le 21:00</strong>: domani è la giornata più piena del viaggio.</p>\n        <div class=\"warn\"><p><strong>Il Nucleo 2 atterra stasera alle 22:15.</strong> Con immigrazione, bagagli e trasferimento arrivano al Koreana <strong>intorno a mezzanotte</strong>. Il trasferimento è il <strong>taxi gratuito dall'aeroporto incluso nella prenotazione Booking</strong>: va attivato in anticipo dentro la prenotazione, con numero di volo e orario, altrimenti all'uscita non c'è nessuno. Avvisate il Koreana dell'arrivo notturno e lasciate un messaggio in reception con il programma di domani mattina. <strong>Prima di uscire dagli arrivi: T-money per tutti e quattro</strong> al convenience store del terminal (CU / GS25, aperto 24 ore, 4.000–5.000 won a tessera) con una prima ricarica in contanti di 20.000–30.000 won: domattina si parte già in metro.</p></div>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>Tutto il giro è in piano e col passeggino; l'unico tratto da marciapiede stretto è Toegye-ro verso Namsangol: tenete il lato interno.</li>\n          <li>Domani alle 8:30 uno di voi è alla biglietteria di Changdeokgung per lo Huwon: stasera decidete chi, e mettete sveglia.</li>\n          <li>Mandate al Nucleo 2 l'indirizzo del Koreana in coreano (서울 중구 세종대로 135): serve al tassista a Incheon.</li>\n        </ul>\n      </div>\n    ", "links": [{"t": "Deoksugung", "h": "https://www.google.com/maps/search/?api=1&amp;query=Deoksugung+Palace+Seoul", "site": false}, {"t": "Doldam-Gil", "h": "https://www.google.com/maps/search/?api=1&amp;query=Deoksugung+Doldam-gil+Seoul", "site": false}, {"t": "Jeongdong-gil", "h": "https://www.google.com/maps/search/?api=1&amp;query=Jeongdong-gil+Seoul", "site": false}, {"t": "Hadongkwan", "h": "https://www.google.com/maps/search/?api=1&amp;query=Hadongkwan+Myeongdong+Seoul", "site": false}, {"t": "Namdaemun Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Namdaemun+Market+Seoul", "site": false}, {"t": "Namsangol Hanok Village", "h": "https://www.google.com/maps/search/?api=1&amp;query=Namsangol+Hanok+Village+Seoul", "site": false}, {"t": "Cheonggye Plaza", "h": "https://www.google.com/maps/search/?api=1&amp;query=Cheonggye+Plaza+Cheonggyecheon+Seoul", "site": false}], "hotels": [["Nucleo 1", "Courtyard Myeongdong · conf. 88806376", "https://www.google.com/maps/search/?api=1&query=Courtyard+by+Marriott+Seoul+Myeongdong"], ["Nucleo 2", "Koreana Hotel · Booking 5543.166.931 · PIN 0276", "https://www.google.com/maps/search/?api=1&query=Koreana+Hotel+Seoul"]]}, {"id": "03", "iso": "2026-10-17", "date": "Sabato 17 ottobre", "title": "I due palazzi, il Giardino Segreto e il mercato più antico", "flag": "TUTTI E SETTE", "acc": "jade", "sec": "seul", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 381\" role=\"img\" aria-label=\"Itinerario del giorno 03\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"381\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><polyline points=\"0.0,100.7 115.3,245.2 255.1,354.7 377.3,363.5 517.1,310.9 580.0,245.2\" fill=\"none\" stroke=\"#C7DCE8\" stroke-width=\"17\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"566\" y=\"369\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">FIUME HAN</text><circle cx=\"242.5\" cy=\"115.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"248.5\" y=\"118.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Jogyesa</text><circle cx=\"254.4\" cy=\"163.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"260.4\" y=\"167.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Myeongdong</text><circle cx=\"339.6\" cy=\"151.1\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"345.6\" y=\"154.6\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">DDP</text><circle cx=\"501.4\" cy=\"247.4\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"507.4\" y=\"250.9\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seongsu</text><circle cx=\"57.7\" cy=\"328.9\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"63.7\" y=\"332.4\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">The Hyundai</text><circle cx=\"40.5\" cy=\"195.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"46.5\" y=\"199.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Hongdae</text><circle cx=\"545.1\" cy=\"313.1\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"551.1\" y=\"316.6\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Ttukseom</text><circle cx=\"305.0\" cy=\"274.1\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"311.0\" y=\"277.6\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Leeum</text><circle cx=\"205.1\" cy=\"202.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"211.1\" y=\"206.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seoul Station</text><path d=\"M 227.1,93.7 L 208.9,102.5 L 255.1,80.6 L 276.0,94.6 L 274.3,118.2 L 307.5,135.3\" fill=\"none\" stroke=\"#136E5E\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"227.1\" cy=\"93.7\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"227.1\" y=\"97.3\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"240.1\" y=\"97.7\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Gyeongbokgung</text><circle cx=\"208.9\" cy=\"102.5\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"208.9\" y=\"106.1\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"221.9\" y=\"106.5\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Tosokchon · pranzo</text><circle cx=\"255.1\" cy=\"80.6\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"255.1\" y=\"84.19999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"268.1\" y=\"84.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Bukchon · marsupio</text><circle cx=\"276.0\" cy=\"94.6\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"276.0\" y=\"98.19999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"289.0\" y=\"98.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Changdeokgung · Huwon</text><circle cx=\"274.3\" cy=\"118.2\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"274.3\" y=\"121.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">5</text><text x=\"287.3\" y=\"122.2\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Ikseon-dong</text><circle cx=\"307.5\" cy=\"135.3\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"307.5\" y=\"138.9\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">6</text><text x=\"320.5\" y=\"139.3\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Gwangjang · sera</text></svg><div class=\"mapcap\">Itinerario del giorno · Seoul</div></div></div></div></div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · 2h30</span>\n        <p><strong>La prima giornata al completo, ed è la più densa del viaggio</strong>: due palazzi, il Giardino Segreto e il mercato. Il Nucleo 2 è atterrato ieri a mezzanotte, e la cosa peggiore che possa fare è dormire fino a tardi: sveglia normale, colazione, e fuori. È una giornata lunga ma tutta a piedi in un raggio di due chilometri, e a fine ottobre è la più bella che Seul possa offrire.</p>\n        <ul>\n          <li><strong>09:30</strong> — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gyeongbokgung+Palace+Seoul\" target=\"_blank\" rel=\"noopener\">Gyeongbokgung Palace</a>, il palazzo principale della dinastia Joseon. <strong>Cambio della guardia reale alle 10:00</strong> al portale Gwanghwamun: quindici minuti di tamburi e costumi.</li>\n          <li>Percorso: Gwanghwamun → Geunjeongjeon (sala del trono) → <strong>Gyeonghoeru</strong>, il padiglione sul lago, e <strong>Hyangwonjeong</strong>, il più fotogenico in autunno.</li>\n          <li><strong>Ingresso gratuito indossando l'hanbok</strong>: noleggi a 3 minuti dal portale. È l'esperienza fotografica del viaggio, e con quattro persone appena arrivate è anche il modo più veloce di entrare nel viaggio.</li>\n          <li>Dentro il recinto, il <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=National+Folk+Museum+of+Korea+Seoul\" target=\"_blank\" rel=\"noopener\">National Folk Museum of Korea</a> ospita un Children's Museum a fasce orarie su prenotazione.</li>\n        </ul>\n        <p><em>Cosa portare</em>: passeggino, ma i cortili sono in ghiaia fine compattata. Preventivate 2h30 con calma.</p>\n        <div class=\"warn\"><p><strong>Gyeongbokgung è chiuso il martedì.</strong> Il sabato è affollato ma pienamente aperto, e il cambio della guardia si fa comunque.</p></div>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 12:30</span>\n        <p><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Tosokchon+Samgyetang+Seoul\" target=\"_blank\" rel=\"noopener\">Tosokchon Samgyetang</a>, Seochon, 6 minuti dall'uscita ovest. <strong>Piatto tipico: <em>samgyetang</em></strong>, pollo intero ripieno di riso glutinoso, ginseng e giuggiole servito bollente nella pentola di pietra. Non è per niente piccante ed è il piatto ricostituente coreano per eccellenza: ideale per chi è appena sceso da un volo di ventitré ore. Coda di 20–30 minuti il sabato: mandate una persona avanti a mettere il nome in lista.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio · la camminata fra i due palazzi</span>\n        <ul>\n          <li><strong>13:30 — attraverso <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Bukchon+Hanok+Village+Seoul\" target=\"_blank\" rel=\"noopener\">Bukchon Hanok Village</a></strong>. Da Gyeongbokgung a Changdeokgung si va a piedi, ed è il percorso più bello del centro: il villaggio di case tradizionali sulla collina fra i due palazzi, vicoli in salita, e in cima la vista sui tetti di tegole con i grattacieli sullo sfondo. <strong>Marsupio</strong>. Venticinque minuti senza soste, un'ora con le foto.</li>\n          <li><strong>14:45 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Changdeokgung+Palace+Seoul\" target=\"_blank\" rel=\"noopener\">CHANGDEOKGUNG</a></strong>, il palazzo UNESCO che i re di Joseon amavano più di tutti, perché invece di imporsi sul terreno lo asseconda: padiglioni disposti secondo le curve della collina, senza simmetrie. Biglietto ordinario all'ingresso, e si cammina verso la porta dello Huwon.</li>\n          <li><strong>15:30 — il GIARDINO SEGRETO (Huwon)</strong>, con la visita guidata in inglese. Trentadue ettari di bosco con laghetti, padiglioni per la lettura e alberi di trecento anni, visitabili <strong>solo con guida a orario fisso</strong>. A fine ottobre è il posto più bello di Seul, senza confronti. Settanta–novanta minuti su sentieri in terra e ghiaia con qualche saliscendi: <strong>marsupio</strong>.</li>\n          <li><strong>17:15</strong> — Discesa verso <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Ikseon-dong+Hanok+Village+Seoul\" target=\"_blank\" rel=\"noopener\">Ikseon-dong</a>, otto minuti a piedi: hanok riconvertiti in caffè e concept store. Un caffè, un dolce, e si riprende il passeggino.</li>\n        </ul>\n        <div class=\"warn\"><p><strong>Huwon: si va di botteghino.</strong> I 50 posti online per sabato 17 sono andati esauriti (매진) in pochi minuti; restano i <strong>50 biglietti del giorno stesso, in vendita dalle 9:00 alla biglietteria di Changdeokgung</strong>. Uno di voi è <strong>davanti alla biglietteria alle 8:30</strong> (gli altri intanto vanno al cambio della guardia di Gyeongbokgung alle 10:00 e lo raggiungono dopo) e chiede <strong>7 biglietti per il turno in inglese delle 15:30</strong>, o delle 14:30 se il primo è pieno: in quel caso si inverte, prima giardino e poi Bukchon. Costo: ingresso palazzo 3.000 + Huwon 5.000 won a adulto, la bimba è gratis ma va dichiarata. Portare carta e contanti (accettano entrambi) e la lista dei sette nomi. Dall'ingresso del palazzo alla porta dello Huwon ci sono 10–15 minuti a piedi: <strong>al portale entro le 15:10</strong>, non aspettano nessuno.</p></div>\n        <div class=\"note\"><p>Bukchon è zona residenziale con <strong>restrizioni orarie ai visitatori nei vicoli principali, in genere fino alle 17:00</strong>: alle 13:30 siete ampiamente dentro l'orario. <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Tongin+Market+Seoul\" target=\"_blank\" rel=\"noopener\">Tongin Market</a>, con i gettoni di ottone per il <em>dosirak</em>, è a quattro minuti da Tosokchon: solo se il pranzo è stato rapido e c'è margine, altrimenti si recupera un altro giorno.</p></div>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata</span>\n        <p><strong>18:00 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gwangjang+Market+Seoul\" target=\"_blank\" rel=\"noopener\">Gwangjang Market</a></strong>, il mercato coperto più antico di Seul (1905) e il tempio dello street food coreano. Da ordinare: <strong><em>bindaetteok</em></strong> (frittella di fagiolo mungo macinato a pietra), <strong><em>mayak gimbap</em></strong>, <strong><em>yukhoe</em></strong> (tartare di manzo con pera e tuorlo), <em>sundae</em>, e makgeolli in ciotola.</p>\n        <p><em>Da sapere</em>: corridoi stretti, sgabelli, pavimento bagnato. <strong>Marsupio</strong>, e arrivate alle 17:30 in punto: un'ora prima dell'ondata serale si mangia seduti invece che in piedi. Si paga quasi tutto in <strong>contanti</strong>.</p>\n        <p><strong>Dopo cena</strong>: dieci minuti a piedi e si è sul <strong>Cheonggyecheon</strong>, il torrente illuminato che scorre sotto la città. Si rientra in hotel camminando lungo l'acqua.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>Da Sogong-ro a Seongsu: 20 minuti di taxi.</li>\n          <li>Per rientrare in sette la sera servono <strong>due Kakao T</strong> (uno normale e uno Venti), non uno solo — ma stasera si torna a piedi lungo il torrente.</li>\n          <li>Per il Nucleo 2 oggi il jet lag morde: la regola è <strong>non dormire prima delle 21:00</strong>, costi quel che costi. Domani è la giornata dell'head spa, cioè il modo più piacevole al mondo di rimettersi in sesto.</li>\n          <li>Se il turno delle 15:30 allo Huwon non fosse disponibile, prendete quello delle 14:30 e invertite: Bukchon dopo il giardino, Ikseon-dong come ultima tappa. Il mercato resta alle 18:00.</li>\n          <li>Oggi è sabato: Seongsu è vivace ma non impraticabile. Le code vere si formano nei caffè fotogenici, sceglietene uno secondario.</li>\n        </ul>\n      </div>\n    ", "links": [{"t": "Gyeongbokgung Palace", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gyeongbokgung+Palace+Seoul", "site": false}, {"t": "National Folk Museum of Korea", "h": "https://www.google.com/maps/search/?api=1&amp;query=National+Folk+Museum+of+Korea+Seoul", "site": false}, {"t": "Tosokchon Samgyetang", "h": "https://www.google.com/maps/search/?api=1&amp;query=Tosokchon+Samgyetang+Seoul", "site": false}, {"t": "Bukchon Hanok Village", "h": "https://www.google.com/maps/search/?api=1&amp;query=Bukchon+Hanok+Village+Seoul", "site": false}, {"t": "Changdeokgung", "h": "https://www.google.com/maps/search/?api=1&amp;query=Changdeokgung+Palace+Seoul", "site": false}, {"t": "Ikseon-dong", "h": "https://www.google.com/maps/search/?api=1&amp;query=Ikseon-dong+Hanok+Village+Seoul", "site": false}, {"t": "Tongin Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Tongin+Market+Seoul", "site": false}, {"t": "Gwangjang Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gwangjang+Market+Seoul", "site": false}], "hotels": [["Nucleo 1", "Courtyard Myeongdong · conf. 88806376", "https://www.google.com/maps/search/?api=1&query=Courtyard+by+Marriott+Seoul+Myeongdong"], ["Nucleo 2", "Koreana Hotel · Booking 5543.166.931 · PIN 0276", "https://www.google.com/maps/search/?api=1&query=Koreana+Hotel+Seoul"]]}, {"id": "04", "iso": "2026-10-18", "date": "Domenica 18 ottobre", "title": "Mezza giornata Head Spa, poi Seul dall'alto", "flag": "", "acc": "jade", "sec": "seul", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 420\" role=\"img\" aria-label=\"Itinerario del giorno 04\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"420\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><polyline points=\"0.0,100.6 115.3,245.0 255.1,354.4 377.3,363.1 517.1,310.6 580.0,245.0\" fill=\"none\" stroke=\"#C7DCE8\" stroke-width=\"17\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"566\" y=\"408\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">FIUME HAN</text><circle cx=\"227.1\" cy=\"93.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"233.1\" y=\"97.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gyeongbokgung</text><circle cx=\"255.1\" cy=\"80.5\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"261.1\" y=\"84.0\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Bukchon</text><circle cx=\"242.5\" cy=\"115.1\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"248.5\" y=\"118.6\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Jogyesa</text><circle cx=\"254.4\" cy=\"163.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"260.4\" y=\"167.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Myeongdong</text><circle cx=\"307.5\" cy=\"135.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"313.5\" y=\"138.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gwangjang</text><circle cx=\"501.4\" cy=\"247.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"507.4\" y=\"250.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seongsu</text><circle cx=\"57.7\" cy=\"328.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"63.7\" y=\"332.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">The Hyundai</text><circle cx=\"40.5\" cy=\"195.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"46.5\" y=\"199.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Hongdae</text><circle cx=\"545.1\" cy=\"312.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"551.1\" y=\"316.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Ttukseom</text><circle cx=\"305.0\" cy=\"273.9\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"311.0\" y=\"277.4\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Leeum</text><circle cx=\"205.1\" cy=\"202.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"211.1\" y=\"206.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seoul Station</text><circle cx=\"513.6\" cy=\"393.7\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"519.6\" y=\"397.2\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">COEX · Starfield</text><circle cx=\"387.8\" cy=\"350.0\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"393.8\" y=\"353.5\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Garosu-gil</text><path d=\"M 257.5,172.8 L 220.5,154.0 L 266.2,217.9 L 335.4,135.6 L 339.6,150.9\" fill=\"none\" stroke=\"#136E5E\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"257.5\" cy=\"172.8\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"257.5\" y=\"176.4\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"270.5\" y=\"176.8\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Park Jun · head spa</text><circle cx=\"220.5\" cy=\"154.0\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"220.5\" y=\"157.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"233.5\" y=\"158.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Deoksugung</text><circle cx=\"266.2\" cy=\"217.9\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"266.2\" y=\"221.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"279.2\" y=\"221.9\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Namsan · tramonto</text><circle cx=\"335.4\" cy=\"135.6\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"335.4\" y=\"139.2\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"348.4\" y=\"139.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Dakhanmari</text><circle cx=\"339.6\" cy=\"150.9\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"339.6\" y=\"154.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">5</text><text x=\"352.6\" y=\"154.9\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">DDP · sera</text></svg><div class=\"mapcap\">Itinerario del giorno · Seoul</div></div></div></div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina &amp; primo pomeriggio · trattamento capelli</span>\n        <p><strong><a class=\"l l-site\" href=\"https://maps.app.goo.gl/8x8ZequwrzFXkBG48?g_st=ic\" target=\"_blank\" rel=\"noopener\">Re.Label × Park Jun Beauty Lab</a>, Myeongdong</strong> — Myeongdong 8-gil 27, <strong>5° piano del Solaria Hotel, nell'edificio M Plaza</strong> (in coreano: 서울 중구 명동8길 27 엠플라자 5층, 박준뷰티랩 명동점). <a class=\"l l-site\" href=\"http://www.hairmyeongdong.com\" target=\"_blank\" rel=\"noopener\">Sito</a> · <a class=\"l l-site\" href=\"https://naver.me/xJGZalOZ\" target=\"_blank\" rel=\"noopener\">Naver Map</a>.</p>\n        <p><strong>Come si entra, perché non è ovvio</strong>: due ingressi allo stesso piano. <strong>Gate 1</strong> è la <em>scala mobile</em> su Myeongdong Street, lato ovest dell'M Plaza; <strong>Gate 2</strong> è l'<em>ascensore</em> dall'ingresso del Solaria Hotel, lato est. Con il passeggino usate il Gate 2. Dalla stazione Myeongdong (linea 4) uscita 6 per il Gate 1, uscita 8 per il Gate 2, due minuti a piedi. Dal Courtyard sono 10 minuti a piedi, dal Koreana 12.</p>\n        <p>Park Jun è la catena di saloni più nota di Seul; il trattamento è la <strong>scalp care / head spa</strong>: diagnosi del cuoio capelluto, detersione profonda, massaggio, maschera, piega finale. Durata indicativa 1h30. Confermate con il salone menù, durata e lingua del personale.</p>\n      </div>\n      <div class=\"note\">\n        <p><strong>Prenotato: domenica 18 alle 10:00, quattro posti, per le donne del gruppo.</strong> Un turno solo, un'ora e mezza: gli uomini tengono la bimba e alle 12 ci si ritrova a pranzo. Chi degli uomini volesse un trattamento può chiedere un posto alle 13:00, senza toccare il resto della giornata.</p>\n      </div>\n      <div class=\"scroll\">\n      <table class=\"tbl\">\n        <thead><tr><th>Orario</th><th>Al salone</th><th>Con la bimba</th></tr></thead>\n        <tbody>\n          <tr><td><strong>10:00–11:30</strong> <span class=\"ok\">prenotato ✓</span></td><td>Le quattro donne</td><td>Gli uomini: Namdaemun Market a sette minuti, poi Deoksugung e il viale Doldam-gil</td></tr>\n          <tr><td><strong>12:00</strong></td><td colspan=\"2\">Ci si ritrova per pranzo da Hadongkwan, a cinque minuti dal salone</td></tr>\n        </tbody>\n      </table>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Per chi è di turno con la bimba · tutto entro 10 minuti a piedi</span>\n        <ul>\n          <li><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Deoksugung+Palace+Seoul\" target=\"_blank\" rel=\"noopener\">Deoksugung Palace</a> e il viale di aceri <strong>Doldam-gil</strong>, uno dei più belli di Seul in autunno. Percorso in piano, ottimo col passeggino.</li>\n          <li><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Shinsegae+Department+Store+Main+Branch+Seoul\" target=\"_blank\" rel=\"noopener\">Shinsegae Main Store</a> e Lotte Sogong, a cinque minuti dal Courtyard: al coperto, con nursing room di livello.</li>\n          <li><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Namsan+Park+Seoul\" target=\"_blank\" rel=\"noopener\">Namsan Park</a> ai piedi della funivia, per chi vuole aria aperta senza salire in cima.</li>\n        </ul>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 12:00, scaglionato</span>\n        <p><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hadongkwan+Myeongdong+Seoul\" target=\"_blank\" rel=\"noopener\">Hadongkwan</a>, Bib Gourmand storica. <strong>Piatto tipico: <em>gomtang</em></strong>, brodo di manzo lungamente sobbollito, bianco e delicatissimo, con riso. Solo a pranzo, chiude presto. Ideale fra un turno e l'altro: non piccante, rapido, adatto alla bimba.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio · dalle 15:30 · Namsan</span>\n        <p><strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Namsan+Seoul+Tower+cable+car\" target=\"_blank\" rel=\"noopener\">NAMSAN e la N Seoul Tower</a>, tutti e sette.</strong> Finito il secondo turno del salone, dieci minuti a piedi e si è alla funivia sul versante di Myeongdong: tre minuti e si è sopra la città. Da lassù si capisce la geografia di Seul — il fiume, le montagne che la chiudono su tre lati, i palazzi reali di ieri incastrati fra i grattacieli. Alle 17:45 il tramonto, poi le luci.</p>\n        <p><em>Cosa portare</em>: la funivia e la terrazza sono accessibili in passeggino; il tratto dalla stazione della funivia alla base della torre ha qualche gradino.</p>\n        <p><em>Per chi ha finito il salone alle 11:30</em>: <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Namdaemun+Market+Seoul\" target=\"_blank\" rel=\"noopener\">Namdaemun Market</a>, il mercato più antico della città, a sette minuti dagli hotel — coperto, in piano, e il pranzo è già lì.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata</span>\n        <p><strong>Cena</strong>: <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Jinokhwa+Halmae+Wonjo+Dakhanmari+Dongdaemun\" target=\"_blank\" rel=\"noopener\">Jinokhwa Halmae Wonjo Dakhanmari</a>, Dongdaemun. <strong>Piatto tipico: <em>dakhanmari</em></strong> — pollo intero bollito in brodo chiaro con patate e porri, tagliato al tavolo e intinto in salsa di senape e aceto di soia; alla fine i noodles nel brodo. <strong>Zero piccante, tavoli grandi, seggioloni</strong>: probabilmente la cena migliore del viaggio per un gruppo misto con bambini.</p>\n        <p>Da Namsan a Dongdaemun sono 15 minuti di taxi: si cena lì e si chiude con la <strong>passeggiata</strong> al <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dongdaemun+Design+Plaza+Seoul\" target=\"_blank\" rel=\"noopener\">Dongdaemun Design Plaza</a>, l'astronave di Zaha Hadid a 5 minuti dal ristorante: piazza pianeggiante, rampe morbide, illuminazione architettonica e il <strong>giardino delle rose LED</strong> sul tetto verde. Attorno, i mall del tessile aperti fino a notte, tutti al coperto e con ascensori. <em>La migliore passeggiata serale di Seul con il passeggino.</em></p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>Al salone uscirete con la piega fatta: programmate la cena, non la palestra.</li>\n          <li>Se il secondo turno del salone finisce tardi, ci si vede direttamente alla funivia: il tramonto non aspetta.</li>\n          <li>DDP → hotel: 12 minuti di taxi.</li>\n        </ul>\n      </div>\n    ", "links": [{"t": "Re.Label × Park Jun Beauty Lab", "h": "https://maps.app.goo.gl/8x8ZequwrzFXkBG48?g_st=ic", "site": true}, {"t": "Sito", "h": "http://www.hairmyeongdong.com", "site": true}, {"t": "Naver Map", "h": "https://naver.me/xJGZalOZ", "site": true}, {"t": "Deoksugung Palace", "h": "https://www.google.com/maps/search/?api=1&amp;query=Deoksugung+Palace+Seoul", "site": false}, {"t": "Shinsegae Main Store", "h": "https://www.google.com/maps/search/?api=1&amp;query=Shinsegae+Department+Store+Main+Branch+Seoul", "site": false}, {"t": "Namsan Park", "h": "https://www.google.com/maps/search/?api=1&amp;query=Namsan+Park+Seoul", "site": false}, {"t": "Hadongkwan", "h": "https://www.google.com/maps/search/?api=1&amp;query=Hadongkwan+Myeongdong+Seoul", "site": false}, {"t": "NAMSAN e la N Seoul Tower", "h": "https://www.google.com/maps/search/?api=1&amp;query=Namsan+Seoul+Tower+cable+car", "site": false}, {"t": "Namdaemun Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Namdaemun+Market+Seoul", "site": false}, {"t": "Jinokhwa Halmae Wonjo Dakhanmari", "h": "https://www.google.com/maps/search/?api=1&amp;query=Jinokhwa+Halmae+Wonjo+Dakhanmari+Dongdaemun", "site": false}, {"t": "Dongdaemun Design Plaza", "h": "https://www.google.com/maps/search/?api=1&amp;query=Dongdaemun+Design+Plaza+Seoul", "site": false}], "hotels": [["Nucleo 1", "Courtyard Myeongdong · conf. 88806376", "https://www.google.com/maps/search/?api=1&query=Courtyard+by+Marriott+Seoul+Myeongdong"], ["Nucleo 2", "Koreana Hotel · Booking 5543.166.931 · PIN 0276", "https://www.google.com/maps/search/?api=1&query=Koreana+Hotel+Seoul"]]}, {"id": "05", "iso": "2026-10-19", "date": "Lunedì 19 ottobre", "title": "Un pranzo a sorpresa, Samcheong-dong e il quartiere dei letterati", "flag": "", "acc": "jade", "sec": "seul", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 420\" role=\"img\" aria-label=\"Itinerario del giorno 05\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"420\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><polyline points=\"0.0,100.6 115.3,245.0 255.1,354.4 377.3,363.1 517.1,310.6 580.0,245.0\" fill=\"none\" stroke=\"#C7DCE8\" stroke-width=\"17\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"566\" y=\"408\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">FIUME HAN</text><circle cx=\"227.1\" cy=\"93.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"233.1\" y=\"97.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gyeongbokgung</text><circle cx=\"255.1\" cy=\"80.5\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"261.1\" y=\"84.0\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Bukchon</text><circle cx=\"254.4\" cy=\"163.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"260.4\" y=\"167.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Myeongdong</text><circle cx=\"339.6\" cy=\"150.9\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"345.6\" y=\"154.4\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">DDP</text><circle cx=\"307.5\" cy=\"135.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"313.5\" y=\"138.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gwangjang</text><circle cx=\"501.4\" cy=\"247.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"507.4\" y=\"250.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seongsu</text><circle cx=\"57.7\" cy=\"328.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"63.7\" y=\"332.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">The Hyundai</text><circle cx=\"40.5\" cy=\"195.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"46.5\" y=\"199.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Hongdae</text><circle cx=\"545.1\" cy=\"312.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"551.1\" y=\"316.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Ttukseom</text><circle cx=\"305.0\" cy=\"273.9\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"311.0\" y=\"277.4\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Leeum</text><circle cx=\"205.1\" cy=\"202.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"211.1\" y=\"206.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seoul Station</text><circle cx=\"513.6\" cy=\"393.7\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"519.6\" y=\"397.2\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">COEX · Starfield</text><circle cx=\"387.8\" cy=\"350.0\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"393.8\" y=\"353.5\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Garosu-gil</text><path d=\"M 242.5,115.1 L 245.3,113.7 L 255.8,120.3 L 219.4,63.0 L 202.7,91.9 L 230.3,137.8\" fill=\"none\" stroke=\"#136E5E\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"242.5\" cy=\"115.1\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"242.5\" y=\"118.69999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"255.5\" y=\"119.1\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Jogyesa</text><circle cx=\"245.3\" cy=\"113.7\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"245.3\" y=\"117.3\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"258.3\" y=\"117.7\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Pranzo · sorpresa 🎁</text><circle cx=\"255.8\" cy=\"120.3\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"255.8\" y=\"123.89999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"268.8\" y=\"124.3\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Insadong</text><circle cx=\"219.4\" cy=\"63.0\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"219.4\" y=\"66.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"232.4\" y=\"67.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Samcheong-dong</text><circle cx=\"202.7\" cy=\"91.9\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"202.7\" y=\"95.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">5</text><text x=\"215.7\" y=\"95.9\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Seochon · Tongin</text><circle cx=\"230.3\" cy=\"137.8\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"230.3\" y=\"141.4\"
