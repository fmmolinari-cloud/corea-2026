a fine ottobre sono ginkgo gialli — e la parallela Serosu-gil: bistrot con dehors, poi i concept store e i marchi indipendenti del dopopranzo.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio · Myeongdong, la spesa vera</span>\n        <p><strong>15:00</strong> — Taxi per Myeongdong, 25 minuti, e si è a casa. Ora che le valigie non devono più prendere treni, si compra sul serio: l'<a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Olive+Young+Myeongdong+Flagship+Seoul\" target=\"_blank\" rel=\"noopener\">Olive Young flagship</a> per tutto il carrello K-beauty rimandato dal giorno 4, con tax refund immediato e passaporto alla mano; lo <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Shinsegae+Department+Store+Main+Branch+Seoul\" target=\"_blank\" rel=\"noopener\">Shinsegae Main</a> per regali e gastronomia; e il <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lotte+Duty+Free+Myeongdong+Seoul\" target=\"_blank\" rel=\"noopener\">Lotte Duty Free</a>.</p>\n        <div class=\"warn\"><p><strong>Nucleo 2: il duty free si chiude oggi.</strong> Gli acquisti al Lotte Duty Free si ritirano in aeroporto e vanno fatti <strong>almeno 24 ore prima del volo</strong> di domani alle 17:50: passateci <strong>entro le 17:30</strong>. Anche il Nucleo 1 può comprare qui: il ritiro è al banco del Terminal 1 il 28.</p></div>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata · l'ULTIMA SERA TUTTI INSIEME</span>\n        <p><strong>18:00 — Cena d'addio, tutti e sette.</strong> È l'ultima sera del gruppo al completo. Una grande <em>hanwoo</em> barbecue house — costata e <em>chadolbaegi</em> di manzo coreano cotti al tavolo, con soju e birra — cercando un locale con tavoli privati e aspirazione dall'alto. È la cena che il gruppo ricorderà.</p>\n        <p><strong>20:00 — CROCIERA SUL FIUME HAN</strong>, dal molo di <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Yeouido+Hangang+Park+cruise+pier+Seoul\" target=\"_blank\" rel=\"noopener\">Yeouido</a>: un'ora fra i ponti illuminati, con la fontana arcobaleno del ponte Banpo (attiva fino a fine ottobre, in genere alle 20:00 e alle 20:30) e lo skyline dai due lati. Si sta seduti al coperto o sul ponte superiore; il passeggino sale a bordo. <em>Orari e disponibilità da verificare la settimana prima: le corse serali del lunedì possono variare.</em></p>\n        <p><em>Alternativa senza barca</em>: la passeggiata di Yeouido Hangang Park, in piano, con la stessa vista dalla riva.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>Fra il Courtyard, Dosan Park, Garosu-gil, Myeongdong e Yeouido sono <strong>quattro tratte di taxi</strong>: due Kakao T ogni volta, o un van con autista per la giornata (~₩250.000), che con le buste della spesa è la scelta giusta. Le buste si lasciano in hotel alle 17, prima della cena.</li>\n          <li>Per il Nucleo 2: <strong>stasera valigie</strong>, e pesatele — Etihad Economy Comfort è meno generosa del Business sul bagaglio.</li>\n          <li>Ultima sera insieme: il saluto vero è questo. Domani mattina ci sono ancora tre ore, ma sono tre ore da valigie.</li>\n        </ul>\n      </div>\n      \n    ", "links": [{"t": "Dosan Park", "h": "https://www.google.com/maps/search/?api=1&amp;query=Dosan+Park+Seoul", "site": false}, {"t": "Apgujeong Rodeo", "h": "https://www.google.com/maps/search/?api=1&amp;query=Apgujeong+Rodeo+Street+Seoul", "site": false}, {"t": "Galleria", "h": "https://www.google.com/maps/search/?api=1&amp;query=Galleria+Department+Store+Apgujeong+Seoul", "site": false}, {"t": "Garosu-gil", "h": "https://www.google.com/maps/search/?api=1&amp;query=Garosu-gil+Seoul", "site": false}, {"t": "Olive Young flagship", "h": "https://www.google.com/maps/search/?api=1&amp;query=Olive+Young+Myeongdong+Flagship+Seoul", "site": false}, {"t": " e-linejoin=\"round\"/><circle cx=\"274.3\" cy=\"118.1\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"274.3\" y=\"121.69999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"287.3\" y=\"122.1\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Ikseon-dong · colazione</text><circle cx=\"228.9\" cy=\"182.4\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"228.9\" y=\"186.0\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"241.9\" y=\"186.4\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Namdaemun Market</text><circle cx=\"254.4\" cy=\"163.6\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"254.4\" y=\"167.2\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"267.4\" y=\"167.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Olive Young · pranzo · saluti 13:30</text><circle cx=\"220.5\" cy=\"154.0\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"220.5\" y=\"157.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"233.5\" y=\"158.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Deoksugung · sera</text></svg><div class=\"mapcap\">Itinerario del giorno · Seoul</div></div></div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · a piedi dagli hotel</span>\n        <p><strong>Mattina lenta e ultime buste, tutti insieme.</strong> Colazione a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Ikseon-dong+Hanok+Village+Seoul\" target=\"_blank\" rel=\"noopener\">Ikseon-dong</a>, che alle nove è vuota e bellissima, poi <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Namdaemun+Market+Seoul\" target=\"_blank\" rel=\"noopener\">Namdaemun Market</a> — a un minuto dal Courtyard, per i regali che a Myeongdong costano il doppio — e l'ultimo giro all'<a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Olive+Young+Myeongdong+Flagship+Seoul\" target=\"_blank\" rel=\"noopener\">Olive Young</a> per quello che ieri è rimasto fuori. Tutto in piano, tutto entro dieci minuti.</p>\n        <div class=\"warn\"><p><strong>Nucleo 2: partenza alle 13:30.</strong> Van privato dal Koreana a Incheon Terminal 1, 70 minuti più margine: al banco Etihad per le 15:00, volo alle 17:50. I chioschi tax refund sono in area partenze <em>prima</em> dei controlli. Il saluto si fa davanti all'hotel.</p></div>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 12:00</span>\n        <p>Presto, tutti e sette, a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Myeongdong+Gyoja+Main+Branch+Seoul\" target=\"_blank\" rel=\"noopener\">Myeongdong Gyoja</a>: il <em>kalguksu</em> del primo giorno, chiusura del cerchio.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio · Nucleo 1</span>\n        <p><strong>Da qui in poi si è di nuovo in tre.</strong> Il pomeriggio è turismo, per chiudere come si era iniziato: 25 minuti di taxi verso est per la <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Lotte+World+Tower+Seoul+Sky\" target=\"_blank\" rel=\"noopener\">Lotte World Tower</a>: il <strong>Seoul Sky</strong> al 117°–123° piano, il quinto grattacielo del mondo, con il pavimento di vetro, e sotto il <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Seokchon+Lake+Seoul\" target=\"_blank\" rel=\"noopener\">lago di Seokchon</a> con l'anello pedonale sotto i ciliegi — a fine ottobre rossi. Tutto in piano, passeggino.</p>\n        <p>In alternativa: una nanna vera per la bimba nel letto, non nel passeggino, e la palestra del Courtyard per voi.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata · Nucleo 1</span>\n        <p>Cena raccolta a Myeongdong, oppure <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Woo+Lae+Oak+Seoul\" target=\"_blank\" rel=\"noopener\">Woo Lae Oak</a> per <em>naengmyeon</em> e <em>bulgogi</em>. <strong>Passeggiata</strong>: Deoksugung di sera e il viale Doldam-gil, a sei minuti dall'hotel. Domani è giornata di partenza.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>Chiedete stasera il <strong>late check-out per domani</strong>: da socio Bonvoy è spesso concedibile fino alle 16:00, ed è la chiave dell'ultima giornata.</li>\n          <li>Liquidi K-beauty tutti in stiva, tranne quelli acquistati in duty free.</li>\n        </ul>\n      </div>\n      \n    ", "links": [{"t": "Ikseon-dong", "h": "https://www.google.com/maps/search/?api=1&amp;query=Ikseon-dong+Hanok+Village+Seoul", "site": false}, {"t": "Namdaemun Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Namdaemun+Market+Seoul", "site": false}, {"t": "Olive Young", "h": "https://www.google.com/maps/search/?api=1&amp;query=Olive+Young+Myeongdong+Flagship+Seoul", "site": false}, {"t": "Myeongdong Gyoja", "h": "https://www.google.com/maps/search/?api=1&amp;query=Myeongdong+Gyoja+Main+Branch+Seoul", "site": false}, {"t": "Lotte World Tower", "h": "https://www.google.com/maps/search/?api=1&amp;query=Lotte+World+Tower+Seoul+Sky", "site": false}, {"t": "lago di Seokchon", "h": "https://www.google.com/maps/search/?api=1&amp;query=Seokchon+Lake+Seoul", "site": false}, {"t": "Woo Lae Oak", "h": "https://www.google.com/maps/search/?api=1&amp;query=Woo+Lae+Oak+Seoul", "site": false}], "hotels": [["Nucleo 1", "Courtyard Myeongdong · conf. 74682758", "https://www.google.com/maps/search/?api=1&query=Courtyard+by+Marriott+Seoul+Myeongdong"], ["Nucleo 2", "in volo · ICN → FCO 17:50", null]]}, {"id": "14", "iso": "2026-10-28", "date": "Mercoledì 28 ottobre", "title": "Una giornata intera a disposizione, poi il volo di mezzanotte", "flag": "SOLO NUCLEO 1", "acc": "jade", "sec": "rientro", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 420\" role=\"img\" aria-label=\"Itinerario del giorno 14\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"420\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><polyline points=\"0.0,100.6 115.3,245.0 255.1,354.4 377.3,363.1 517.1,310.6 580.0,245.0\" fill=\"none\" stroke=\"#C7DCE8\" stroke-width=\"17\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"566\" y=\"408\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">FIUME HAN</text><circle cx=\"227.1\" cy=\"93.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"233.1\" y=\"97.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gyeongbokgung</text><circle cx=\"255.1\" cy=\"80.5\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"261.1\" y=\"84.0\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Bukchon</text><circle cx=\"242.5\" cy=\"115.1\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"248.5\" y=\"118.6\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Jogyesa</text><circle cx=\"339.6\" cy=\"150.9\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"345.6\" y=\"154.4\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">DDP</text><circle cx=\"307.5\" cy=\"135.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"313.5\" y=\"138.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gwangjang</text><circle cx=\"501.4\" cy=\"247.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"507.4\" y=\"250.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seongsu</text><circle cx=\"40.5\" cy=\"195.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"46.5\" y=\"199.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Hongdae</text><circle cx=\"545.1\" cy=\"312.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"551.1\" y=\"316.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Ttukseom</text><circle cx=\"305.0\" cy=\"273.9\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"311.0\" y=\"277.4\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Leeum</text><circle cx=\"205.1\" cy=\"202.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"211.1\" y=\"206.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seoul Station</text><circle cx=\"513.6\" cy=\"393.7\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"519.6\" y=\"397.2\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">COEX</text><circle cx=\"387.8\" cy=\"350.0\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"393.8\" y=\"353.5\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Garosu-gil</text><path d=\"M 57.7,328.6 L 76.9,317.2 L 230.6,184.6 L 254.4,163.6\" fill=\"none\" stroke=\"#136E5E\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"57.7\" cy=\"328.6\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"57.7\" y=\"332.20000000000005\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"70.7\" y=\"332.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">The Hyundai Seoul</text><circle cx=\"76.9\" cy=\"317.2\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"76.9\" y=\"320.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"89.9\" y=\"321.2\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Yeouido · pranzo</text><circle cx=\"230.6\" cy=\"184.6\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"230.6\" y=\"188.2\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"243.6\" y=\"188.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Hotel · docce e valigie</text><circle cx=\"254.4\" cy=\"163.6\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"254.4\" y=\"167.2\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"267.4\" y=\"167.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Myeongdong · ultimo giro</text></svg><div class=\"mapcap\">Itinerario del giorno · Seoul</div></div></div></div></div>\n      <div class=\"warn\">\n        <p><strong>La decisione più importante di oggi.</strong> Il volo parte alle 23:45. Con una bimba di 18 mesi, passare il pomeriggio senza una stanza dove riposare e fare la doccia prima di un volo notturno di nove ore è l'errore che rovina il rientro. Due soluzioni: <strong>late check-out Bonvoy</strong> fino alle 16:00 (da chiedere adesso, con la conferma 74682758), oppure <strong>day use fino alle 19:00</strong>. Costa una notte in più e vale ogni euro. <strong>Il Nucleo 1 lo faccia senza esitare.</strong></p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · dalle 10:30</span>\n        <p><strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=The+Hyundai+Seoul+Yeouido\" target=\"_blank\" rel=\"noopener\">THE HYUNDAI SEOUL</a></strong>, Yeouido, 20 minuti di taxi dal Courtyard: il grande magazzino più spettacolare della Corea, dodici piani attorno a un pozzo di luce, con <strong>Sounds Forest</strong> al 5° — un giardino interno di 1.000 m² con alberi veri sotto una volta di vetro — e la Sky Park al 6°. È il posto ideale per l'ultimo giorno: tutto al coperto, ascensori ovunque, nursing room eccellente, e la bimba cammina libera nel giardino mentre voi fate l'ultimo giro. <em>Aperto il mercoledì.</em></p>\n        <p><em>In alternativa</em>: <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hongdae+Seoul\" target=\"_blank\" rel=\"noopener\">Hongdae</a> e il parco lineare di <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Yeonnam-dong+Gyeongui+Line+Forest+Park+Seoul\" target=\"_blank\" rel=\"noopener\">Yeonnam-dong</a>, la Seul giovane — a 25 minuti di taxi.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 12:30</span>\n        <p>La food hall interrata di The Hyundai, una delle migliori di Seul, oppure — per chiudere in modo tradizionale — <strong><em>seolleongtang</em></strong>, il brodo bianco di ossa di manzo sobbollito per ore, a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Yeouido+Hangang+Park+Seoul\" target=\"_blank\" rel=\"noopener\">Yeouido</a>, e un ultimo giro sul lungofiume.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio</span>\n        <p><strong>15:00 · rientro in hotel: docce e valigie chiuse.</strong> Questa è l'altra pausa che ha una ragione precisa — non il riposo della bimba, ma il fatto che stanotte si vola nove ore. Palestra o piscina per chi vuole arrivare stanco al volo, strategia efficace. <strong>17:00</strong> ultimo giro a Myeongdong, a otto minuti, se manca qualcosa.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; partenza</span>\n        <ul>\n          <li><strong>18:30</strong> — Cena presto e leggera vicino all'hotel: <em>korean fried chicken</em> o una zuppa. Non appesantitevi, cenerete di nuovo a bordo se vorrete.</li>\n          <li><strong>19:45</strong> — Van privato dal Courtyard per Incheon: 70 minuti più margine traffico.</li>\n          <li><strong>21:00</strong> — Arrivo a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Incheon+International+Airport+Terminal+1\" target=\"_blank\" rel=\"noopener\">Incheon Terminal 1</a> (verificare al check-in). Banco Business, ritiro degli acquisti duty free, sicurezza: <strong>a Incheon i controlli richiedono fino a un'ora nelle fasce di punta</strong>.</li>\n          <li><strong>21:45–23:00</strong> — Lounge. Passeggino riconsegnato <strong>al gate</strong>: chiedete il <em>gate delivery</em> per riaverlo ad Abu Dhabi.</li>\n          <li><strong>23:45</strong> — Decollo.</li>\n        </ul>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>I chioschi tax refund sono in area partenze <strong>prima</strong> dei controlli: andateci appena arrivati, non dopo.</li>\n          <li>Riempite le borracce dopo la sicurezza e chiedete acqua calda per il latte: in aeroporto lo fanno ovunque.</li>\n          <li>Il volo notturno è la condizione ideale per la bimba: arriva a bordo già stanca e ha nove ore per dormire.</li>\n        </ul>\n      </div>\n    ", "links": [{"t": "The Hyundai Seoul", "h": "https://www.google.com/maps/search/?api=1&amp;query=The+Hyundai+Seoul+Yeouido", "site": false}, {"t": "Hongdae", "h": "https://www.google.com/maps/search/?api=1&amp;query=Hongdae+Seoul", "site": false}, {"t": "Yeonnam-dong", "h": "https://www.google.com/maps/search/?api=1&amp;query=Yeonnam-dong+Gyeongui+Line+Forest+Park+Seoul", "site": false}, {"t": "Yeouido", "h": "https://www.google.com/maps/search/?api=1&amp;query=Yeouido+Hangang+Park+Seoul", "site": false}, {"t": "Incheon Terminal 1", "h": "https://www.google.com/maps/search/?api=1&amp;query=Incheon+International+Airport+Terminal+1", "site": false}], "hotels": [["Nucleo 1", "in volo · ICN 23:45 → AUH · chiedere late check-out Courtyard", null]]}, {"id": "15", "iso": "2026-10-29", "date": "Giovedì 29 ottobre", "title": "Una giornata di mare fra due voli", "flag": "", "acc": "gold", "sec": "abudhabi", "html": "\n      <div class=\"nuc\" style=\"border-left:4px solid var(--jade); margin-bottom:16px\"><div class=\"who\">Prenotazione confermata ✓</div>\n        <div class=\"name\"><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Sheraton+Abu+Dhabi+Hotel+Resort+Corniche\" target=\"_blank\" rel=\"noopener\">Sheraton Abu Dhabi Hotel &amp; Resort</a></div>\n        <span class=\"prog bonvoy\">Marriott Bonvoy · conferma 75632961</span>\n        <p><strong>29–30 ottobre, Club Room con accesso alla Club Lounge, letto king, vista città, 2 adulti + 1 bambina: 1.214 AED (≈ 305 €), tasse incluse.</strong> Corniche Road, sul lungomare: spiaggia privata, piscine, e la lounge — che con un arrivo all'alba vale più della camera. Tel. +971 2 677 3333. Check-in ufficiale alle 15:00, check-out alle 12:00.</p></div>\n      <div class=\"warn\"><p><strong>Atterrate alle 05:20 e il check-in è alle 15:00.</strong> Scrivete <strong>adesso</strong> all'hotel citando la conferma 75632961: chiedete l'<em>early check-in</em> dalle 7:00 — con lo status Bonvoy e una camera Club spesso lo concedono, altrimenti si paga mezza giornata — e, in subordine, che vi lascino usare la Club Lounge e la piscina dalle 7 mentre aspettate. Dopo nove ore di volo con una bimba, la differenza fra \"camera alle 7\" e \"camera alle 15\" è tutta la giornata.</p></div>\n      <div class=\"blk\"><span class=\"lab\">Giornata</span>\n   function placeName(a){
    var h=a.getAttribute('href')||''; var m=h.match(/[?&]query=([^&]+)/);
    var q=m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';
    var t=(a.textContent||'').trim();
    return {q:q||t, t:t};
  }
  var KR=JSON.parse(document.getElementById('krdata').textContent);
  function krName(q,t){
    if(KR[q]) return KR[q];
    var k=Object.keys(KR).find(function(x){ return q.toLowerCase().indexOf(x.toLowerCase())===0 || t.toLowerCase()===x.toLowerCase(); });
    if(k) return KR[k];
    // ultimo tentativo: testo in hangul già presente nel link
    var m=t.match(/[가-힣][가-힣\s\d]*/); return m?m[0].trim():null;
  }
  function openSheet(a){
    var p=placeName(a); var q=p.q; var enc=encodeURIComponent(q);
    var kr=krName(q,p.t); var kenc=kr?encodeURIComponent(kr):null;
    var shortQ=q.replace(/\s+(Seoul|Busan|Gyeongju)$/i,''); var senc=encodeURIComponent(shortQ);
    var isSite=/l-site/.test(a.className); var href=a.getAttribute('href');
    var o=document.createElement('div'); o.className='sheetp';
    var h='<div class="pan"><h3>'+esc(p.t)+'</h3><p class="sub2">'+esc(kr||shortQ)+(kr?' · <span style="user-select:all">'+esc(kr)+'</span>':'')+'</p><div class="opts">';
    if(isSite) h+='<a class="site" target="_blank" rel="noopener" href="'+href+'"><span>🌐</span>Sito ufficiale / scheda</a>';
    h+='<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+enc+'"><span>📍</span>Google Maps</a>';
    h+='<a target="_blank" rel="noopener" href="https://map.kakao.com/?q='+(kenc||senc)+'"><span>🟡</span>Kakao Map'+(kr?'':' (EN)')+'</a>';
    h+='<a target="_blank" rel="noopener" href="https://map.naver.com/p/search/'+(kenc||senc)+'"><span>🟢</span>Naver Map'+(kr?'':' (EN)')+'</a>';
    h+='<a target="_blank" rel="noopener" href="https://www.tripadvisor.com/Search?q='+senc+'"><span>🦉</span>TripAdvisor</a>';
    h+='<a target="_blank" rel="noopener" href="https://www.google.com/search?q='+enc+'"><span>🔎</span>Google</a>';
    if(kr) h+='<a href="#" class="copykr" data-kr="'+esc(kr)+'"><span>📋</span>Copia il nome coreano</a>';
    else h+='<a target="_blank" rel="noopener" href="https://papago.naver.com/?sk=auto&tk=ko&st='+senc+'"><span>🈶</span>Nome in coreano (Papago)</a>';
    h+='</div><button class="close" type="button">Chiudi</button></div>';
    o.innerHTML=h;
    o.addEventListener('click',function(e){
      var c=e.target.closest('.copykr'); if(c){ e.preventDefault(); var v=c.dataset.kr; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){ c.innerHTML='<span>✅</span>Copiato: '+esc(v); },function(){ prompt('Copia il nome coreano:',v); }); return; }
      if(e.target===o||e.target.classList.contains('close')) o.remove(); });
    document.body.appendChild(o);
  }
  function bindPlaces(root){
    root.querySelectorAll('a.l, .lnks a').forEach(function(a){
      var h=a.getAttribute('href')||'';
      if(!/google\.com\/maps|maps\.app\.goo\.gl/.test(h) && !/l-site/.test(a.className) && !a.closest('.lnks')) return;
      a.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); openSheet(a); });
    });
  }
  // sorprese
  function bindSp(){ document.querySelectorAll('.sp').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); el.classList.toggle('on'); }; }); }
  var sb=document.getElementById('toggleSp');
  sb.addEventListener('click',function(){ document.body.classList.toggle('reveal'); sb.textContent=document.body.classList.contains('reveal')?'🎁 nascondi':'🎁'; });
  // orologio
  function tick(){ var f=new Intl.DateTimeFormat('it-IT',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'}); var r=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit'}); document.getElementById('clock').innerHTML='<b>'+f.format(new Date())+'</b>Seul · Roma '+r.format(new Date()); }
  function hdr(){ document.documentElement.style.setProperty('--hdr', document.querySelector('.app-top').offsetHeight+'px'); }
  hdr(); window.addEventListener('resize',hdr);
  tick(); setInterval(tick,20000);
  applyWho(); route(); if(!WHO) askWho();
})();
</script>
