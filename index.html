text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">6</text><text x=\"243.3\" y=\"141.8\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Gwanghwamun · sera</text></svg><div class=\"mapcap\">Itinerario del giorno · Seoul</div></div></div></div></div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · dalle 10:00</span>\n        <ul>\n          <li><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Jogyesa+Temple+Seoul\" target=\"_blank\" rel=\"noopener\">Jogyesa Temple</a>, Jongno-gu: il tempio principale dell'ordine Jogye, il cuore del buddhismo coreano <strong>in pieno centro città</strong>. Il contrasto fra l'albero di lauro di 500 anni, i lanterni colorati e i grattacieli attorno è l'immagine che vi porterete a casa. Ingresso libero, cortile completamente in piano.</li>\n          <li><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Insadong+Ssamziegil+Seoul\" target=\"_blank\" rel=\"noopener\">Insadong</a> a 5 minuti: gallerie, cartolerie di carta <em>hanji</em>, ceramica e case da tè. <strong>Ssamziegil</strong>, il centro commerciale a spirale, è percorribile in passeggino grazie alla rampa continua.</li>\n        </ul>\n      </div>\n      <div class=\"blk spblk\"><span class=\"lab\">Pranzo · 11:30 · tutti e sette · confermato ✓</span><div class=\"sp\">\n        <p><a class=\"l l-site\" href=\"https://english.visitseoul.net/area/Balwoo-Gongyang/ENP030871\" target=\"_blank\" rel=\"noopener\">BALWOO GONGYANG</a> ⭐, 5° piano del Templestay Information Center, di fronte al portale di Jogyesa.</p>\n        <ul>\n          <li>È <strong>l'unico ristorante gestito direttamente dall'Ordine Jogye</strong>: cucina <em>sachal eumsik</em>, vegana per definizione e priva dei cinque aromi pungenti (aglio, cipolla, porro, erba cipollina, scalogno). La profondità di sapore viene dai <em>jang</em> fermentati nei templi, invecchiati per anni.</li>\n          <li>Menù degustazione a più livelli, indicativamente 45.000–70.000 KRW a persona secondo il numero di portate. A ottobre: funghi di montagna, giuggiole, zucca, radice di campanula.</li>\n          <li><strong>Sala privata</strong>: <em>tutti</em> i tavoli sono in stanze separate — è la struttura stessa del ristorante. Richiedetene una per 7 all'atto della prenotazione: la bimba è a casa propria, nessuno la sente, e voi non state in tensione per due ore. <strong>È esattamente per questo che è la tavola giusta per il vostro gruppo.</strong> Seggiolone da chiedere in anticipo.</li>\n          <li><strong>Quattro livelli di menù</strong>: <em>Seonsik</em> \"Zen\" 30.000 · <em>Wonsik</em> \"Wish\" 45.000 · <em>Maeumsik</em> \"Mind\" 60.000 · <em>Huisik</em> \"Joy\" 90.000 won. Essendo l'unica tavola d'autore del viaggio, vale la pena salire almeno al Mind.</li>\n        </ul>\n        <div class=\"note\"><p><strong>Prenotazione confermata ✓</strong> dal concierge del Courtyard (Lia, 28 settembre): <strong>lunedì 19 ottobre, ore 11:30, 7 persone, sala privata</strong>, a nome Fabio. Nessun deposito, ma il ristorante ha chiesto esplicitamente di onorare la prenotazione: con sette coperti un no-show li mette in difficoltà. Arrivate alle 11:20.</p></div>\n        <div class=\"note\"><p><strong>Perché è questa e non un'altra.</strong> Quasi tutti i grandi ristoranti di Seul hanno un limite d'età: <strong>Mingles, per esempio, accetta ospiti solo dai 10 anni in su</strong>, e la regola non si aggira. Balwoo Gongyang no — è gestito dall'Ordine Jogye, ha solo sale private e nessuna barriera d'ingresso. È l'unico modo di avere una stella Michelin <em>con tutti e sette a tavola</em>, ed è per giunta l'esperienza che volevate fin dall'inizio.</p></div>\n      </div></div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio · dalle 14:30</span>\n        <p><strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Samcheong-dong+Seoul\" target=\"_blank\" rel=\"noopener\">SAMCHEONG-DONG</a></strong>, quindici minuti a piedi da Insadong lungo il fianco est di Gyeongbokgung: la via delle gallerie, dei caffè in hanok e delle boutique, con i vicoli in salita verso Bukchon. Una sosta al <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=MMCA+Seoul+Samcheong\" target=\"_blank\" rel=\"noopener\">MMCA Seoul</a> (museo d'arte contemporanea, ingresso 2.000 won, il lunedì è aperto): il cortile e il caffè guardano il Bugaksan.</p>\n        <div class=\"warn\"><p><strong>Cheong Wa Dae, la “Casa Blu”, è di nuovo la residenza del presidente</strong>: le visite al pubblico sono sospese dall'agosto 2025 e dal dicembre 2025 l'ufficio presidenziale è rientrato nel complesso. <strong>Si vede solo da fuori</strong>: dalla <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Cheongwadae+Fountain+Plaza+Seoul\" target=\"_blank\" rel=\"noopener\">piazza della fontana della Fenice</a>, davanti al cancello principale, si fotografano i tetti di tegole azzurre con il Bugaksan dietro (controlli di sicurezza, passaporto in tasca). Il <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Cheongwadae+Sarangchae\" target=\"_blank\" rel=\"noopener\">Sarangchae</a>, il museo gratuito di fronte, è chiuso il lunedì. Cinque minuti, una foto, e si prosegue verso Seochon costeggiando il muro nord del palazzo.</p></div>\n        <p><em>Cosa portare</em>: passeggino. Tutto in piano, salvo i vicoli alti di Samcheong-dong.</p>\n        <p><strong>16:30 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Seochon+Seoul\" target=\"_blank\" rel=\"noopener\">SEOCHON</a></strong>, il “villaggio a ovest” del palazzo: il quartiere dei letterati e dei pittori di Joseon, oggi vicoli di hanok bassi, botteghe di ceramica, librerie e caffè. Molto meno turistico di Bukchon, e tutto in piano. A <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Tongin+Market+Seoul\" target=\"_blank\" rel=\"noopener\">Tongin Market</a> si comprano i gettoni di ottone e si riempie un vassoio da <em>dosirak</em> girando fra i banchi: la merenda giusta.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata</span>\n        <p>Dopo un pranzo di due ore la sera si va leggeri. <strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Woo+Lae+Oak+Seoul\" target=\"_blank\" rel=\"noopener\">Woo Lae Oak</a></strong>, aperto nel 1946 e passato di padre in figlio: <em>naengmyeon</em> in stile Pyongyang e <em>bulgogi</em> alla brace in un locale ampio, tranquillo e senza cerimonie.</p>\n        <p><strong>Passeggiata</strong>: <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gwanghwamun+Square+Seoul\" target=\"_blank\" rel=\"noopener\">Gwanghwamun Square</a> illuminata, con la statua di re Sejong e il portale del palazzo sullo sfondo, e da lì il <strong>Cheonggyecheon</strong> fino a Myeongdong. Ultima sera in centro: da domani si va a Gyeongju.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li><strong>Stasera si prepara il trasferimento</strong>: valigie pronte entro le 22:00.</li>\n          <li><strong>Suggerimento forte: servizio di consegna bagagli hotel-to-hotel.</strong> In Corea operano servizi che ritirano le valigie in albergo la mattina e le consegnano all'hotel di destinazione. Con 7 persone, 8 valigie, un passeggino e un KTX da prendere, vale ogni won: viaggereste verso Gyeongju con i soli zaini. Chiedete alla reception del Courtyard, verificando i tempi di consegna.</li>\n          <li>Se non lo usate: alle carrozze KTX ci sono rastrelliere bagagli alle testate, poche e contese. Salite per primi.</li>\n        </ul>\n      </div>\n    ", "links": [{"t": "Jogyesa Temple", "h": "https://www.google.com/maps/search/?api=1&amp;query=Jogyesa+Temple+Seoul", "site": false}, {"t": "Insadong", "h": "https://www.google.com/maps/search/?api=1&amp;query=Insadong+Ssamziegil+Seoul", "site": false}, {"t": "Samcheong-Dong", "h": "https://www.google.com/maps/search/?api=1&amp;query=Samcheong-dong+Seoul", "site": false}, {"t": "MMCA Seoul", "h": "https://www.google.com/maps/search/?api=1&amp;query=MMCA+Seoul+Samcheong", "site": false}, {"t": "piazza della fontana della Fenice", "h": "https://www.google.com/maps/search/?api=1&amp;query=Cheongwadae+Fountain+Plaza+Seoul", "site": false}, {"t": "Sarangchae", "h": "https://www.google.com/maps/search/?api=1&amp;query=Cheongwadae+Sarangchae", "site": false}, {"t": "Seochon", "h": "https://www.google.com/maps/search/?api=1&amp;query=Seochon+Seoul", "site": false}, {"t": "Tongin Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Tongin+Market+Seoul", "site": false}, {"t": "Woo Lae Oak", "h": "https://www.google.com/maps/search/?api=1&amp;query=Woo+Lae+Oak+Seoul", "site": false}, {"t": "Gwanghwamun Square", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gwanghwamun+Square+Seoul", "site": false}], "hotels": [["Nucleo 1", "Courtyard Myeongdong · conf. 88806376", "https://www.google.com/maps/search/?api=1&query=Courtyard+by+Marriott+Seoul+Myeongdong"], ["Nucleo 2", "Koreana Hotel · Booking 5543.166.931 · PIN 0276", "https://www.google.com/maps/search/?api=1&query=Koreana+Hotel+Seoul"]]}, {"id": "06", "iso": "2026-10-20", "date": "Martedì 20 ottobre", "title": "Il treno del mattino, i tumuli reali, il padiglione riflesso", "flag": "", "acc": "gold", "sec": "gyeongju", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 244\" role=\"img\" aria-label=\"Itinerario del giorno 06\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"244\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><circle cx=\"395.3\" cy=\"40.7\" r=\"26\" fill=\"#DCEAF2\" opacity=\".8\"/><circle cx=\"395.3\" cy=\"40.7\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"401.3\" y=\"44.2\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Lago Bomun</text><circle cx=\"501.9\" cy=\"209.1\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"507.9\" y=\"212.6\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Bulguksa</text><path d=\"M 30.8,180.1 L 217.8,77.0 L 215.4,75.5 L 234.4,79.0 L 252.1,79.0 L 213.1,81.3\" fill=\"none\" stroke=\"#7A5B17\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"30.8\" cy=\"180.1\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"30.8\" y=\"183.7\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"43.8\" y=\"184.1\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Arrivo KTX 11:00</text><circle cx=\"217.8\" cy=\"77.0\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"217.8\" y=\"80.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"230.8\" y=\"81.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Hotel · centro</text><circle cx=\"215.4\" cy=\"75.5\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"215.4\" y=\"79.1\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"228.4\" y=\"79.5\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Daereungwon</text><circle cx=\"234.4\" cy=\"79.0\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"234.4\" y=\"82.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"247.4\" y=\"83.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Pink muhly · Cheomseongdae</text><circle cx=\"252.1\" cy=\"79.0\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"252.1\" y=\"82.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">5</text><text x=\"265.1\" y=\"83.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Donggung & Wolji · sera</text><circle cx=\"213.1\" cy=\"81.3\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"213.1\" y=\"84.89999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">6</text><text x=\"226.1\" y=\"85.3\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Hwangnidan-gil · cena</text></svg><div class=\"mapcap\">Itinerario del giorno · Gyeongju</div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina</span>\n        <ul>\n          <li><strong>07:45</strong> colazione, <strong>09:00</strong> check-out e trasferimento a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Seoul+Station+KTX\" target=\"_blank\" rel=\"noopener\">Seoul Station</a>: dal Courtyard sono <strong>dieci minuti a piedi</strong>, tre di taxi con le valigie.</li>\n          <li><strong>09:58 — KTX 025 Seoul → <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gyeongju+Station+KTX\" target=\"_blank\" rel=\"noopener\">GYEONGJU</a>, arrivo 12:11.</strong> <span class=\"ok\">Biglietti emessi ✓</span> carrozza 14, posti 2C–2D e 3A–3D, ₩44.100 a testa. Sedili ampi e reclinabili, presa elettrica, vagoni silenziosi: la bimba dormirà. Dalla stazione al centro storico: <strong>20 minuti di taxi</strong>.</li>\n        </ul>\n        <div class=\"note\"><p><strong>La stazione.</strong> Sul biglietto c'è scritto <strong>Gyeongju (경주)</strong>: è la stazione KTX, l'ex Singyeongju, fuori città a 15–20 minuti di taxi dal centro storico. In centro non ci sono più treni.</p></div>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 12:45</span>\n        <p>Appena scesi, <strong>12:15 trasferimento in taxi a Hwangnam-dong (~20 minuti)</strong>, deposito bagagli alla casa (Hwangridan Stay, orario di check-in da confermare) e pranzo in una delle trattorie di Hwangnidan-gil, a due passi. <strong>Piatto tipico da cercare a Gyeongju: il <em>ssambap</em></strong>, riso e una ventina di contorni da avvolgere in foglie di verdura.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio</span>\n        <p><strong>14:30 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Daereungwon+Tomb+Complex+Gyeongju\" target=\"_blank\" rel=\"noopener\">DAEREUNGWON TOMB COMPLEX</a></strong>, a piedi dall'hotel: ventitré tumuli funerari reali di Silla, colline erbose perfettamente tornite in mezzo alla città. Dentro si visita il <strong>Cheonmachong</strong>, l'unica tomba aperta, con la corona d'oro e la sella dipinta col cavallo alato.</p>\n        <p>Proseguendo a piedi, in un unico anello: <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Cheomseongdae+Observatory+Gyeongju\" target=\"_blank\" rel=\"noopener\">CHEOMSEONGDAE</a>, l'osservatorio astronomico più antico dell'Asia orientale (VII secolo), circondato dai <strong>campi di pink muhly al picco</strong> e dai cosmos, e la <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gyerim+Forest+Gyeongju\" target=\"_blank\" rel=\"noopener\">foresta di Gyerim</a>, boschetto sacro che a fine ottobre vira all'oro.</p>\n        <p><em>Cosa portare</em>: passeggino. Vialetti larghi, in ghiaia fine ben battuta, completamente pianeggianti. Cheomseongdae e Gyerim a ingresso libero.</p>\n        <p><strong>17:00</strong> — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hwangnidan-gil+Gyeongju\" target=\"_blank\" rel=\"noopener\">Hwangnidan-gil</a> per un caffè e il primo <em>hwangnam-ppang</em>, il pane dolce ripieno di fagioli rossi che è il souvenir della città.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata · l'immagine-simbolo di Gyeongju</span>\n        <p><strong>18:30</strong> — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Donggung+Palace+and+Wolji+Pond+Gyeongju\" target=\"_blank\" rel=\"noopener\">DONGGUNG PALACE &amp; WOLJI POND</a> (l'antico Anapji). Il palazzo del principe ereditario di Silla e il suo stagno artificiale: <strong>al calare del buio i tre padiglioni ricostruiti si specchiano nell'acqua immobile</strong>. È una delle vedute notturne più celebri della Corea e vale l'intero viaggio a Gyeongju. Aperto in genere fino alle 22:00, ultimo ingresso ~21:30 (verificare l'orario stagionale).</p>\n        <p><em>Accessibilità molto buona</em>: l'anello attorno allo stagno è largo, in ghiaia compattata e in piano. Passeggino promosso.</p>\n        <p><strong>Cena</strong>: dopo la visita, <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Hwangnidan-gil+Gyeongju\" target=\"_blank\" rel=\"noopener\">Hwangnidan-gil</a>, <strong>a dieci minuti a piedi</strong>, la via alla moda di Gyeongju con ristoranti in hanok e caffè fino a tardi. Si rientra camminando.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>Dormendo in centro, <strong>oggi si fa tutto a piedi</strong>. Mercoledì, per Bulguksa e Seokguram, bastano <strong>due taxi</strong>: ~₩25.000 a tratta ciascuno, e la reception li chiama.</li>\n          <li>Le sere sono sensibilmente più fredde che a Seul: coperta per il passeggino.</li>\n        </ul>\n      </div>\n      \n    ", "links": [{"t": "Seoul Station", "h": "https://www.google.com/maps/search/?api=1&amp;query=Seoul+Station+KTX", "site": false}, {"t": "Gyeongju", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gyeongju+Station+KTX", "site": false}, {"t": "Daereungwon Tomb Complex", "h": "https://www.google.com/maps/search/?api=1&amp;query=Daereungwon+Tomb+Complex+Gyeongju", "site": false}, {"t": "Cheomseongdae", "h": "https://www.google.com/maps/search/?api=1&amp;query=Cheomseongdae+Observatory+Gyeongju", "site": false}, {"t": "foresta di Gyerim", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gyerim+Forest+Gyeongju", "site": false}, {"t": "Hwangnidan-gil", "h": "https://www.google.com/maps/search/?api=1&amp;query=Hwangnidan-gil+Gyeongju", "site": false}, {"t": "Donggung Palace & Wolji Pond", "h": "https://www.google.com/maps/search/?api=1&amp;query=Donggung+Palace+and+Wolji+Pond+Gyeongju", "site": false}], "hotels": [["Tutti e sette", "Hwangridan Stay · Booking 6224.977.751 · PIN 0657", "https://www.google.com/maps/search/?api=1&query=Hwangridan+Stay+Gyeongju"]]}, {"id": "07", "iso": "2026-10-21", "date": "Mercoledì 21 ottobre", "title": "Bulguksa, il tunnel di aceri e il ponte sull'acqua · ultima notte a Gyeongju", "flag": "", "acc": "gold", "sec": "gyeongju", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 244\" role=\"img\" aria-label=\"Itinerario del giorno 07\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"244\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><circle cx=\"395.3\" cy=\"40.7\" r=\"26\" fill=\"#DCEAF2\" opacity=\".8\"/><circle cx=\"395.3\" cy=\"40.7\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"401.3\" y=\"44.2\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Lago Bomun</text><circle cx=\"252.1\" cy=\"79.0\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"258.1\" y=\"82.5\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Donggung & Wolji</text><circle cx=\"215.4\" cy=\"75.5\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"221.4\" y=\"79.0\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Daereungwon</text><circle cx=\"213.1\" cy=\"81.3\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"219.1\" y=\"84.8\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Hwangnidan-gil</text><circle cx=\"30.8\" cy=\"180.1\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"36.8\" y=\"183.6\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Stazione KTX</text><path d=\"M 501.9,209.1 L 539.8,194.6 L 220.2,95.9 L 227.3,93.0 L 217.8,77.0\" fill=\"none\" stroke=\"#7A5B17\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"501.9\" cy=\"209.1\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"501.9\" y=\"212.7\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"488.9\" y=\"213.1\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Bulguksa</text><circle cx=\"539.8\" cy=\"194.6\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"539.8\" y=\"198.2\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"526.8\" y=\"198.6\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Seokguram · marsupio</text><circle cx=\"220.2\" cy=\"95.9\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"220.2\" y=\"99.5\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"233.2\" y=\"99.9\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Gyochon · beopju</text><circle cx=\"227.3\" cy=\"93.0\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"227.3\" y=\"96.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"240.3\" y=\"97.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Woljeonggyo · sera</text><circle cx=\"217.8\" cy=\"77.0\" r=\"9.5\" fill=\"#7A5B17\"/><text x=\"217.8\" y=\"80.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">5</text><text x=\"230.8\" y=\"81.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Hotel · a piedi</text></svg><div class=\"mapcap\">Itinerario del giorno · Gyeongju</div></div></div></div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · 2h30–3h</span>\n        <p><strong>09:00</strong> — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Bulguksa+Temple+Gyeongju\" target=\"_blank\" rel=\"noopener\">BULGUKSA TEMPLE</a> (UNESCO), 25 minuti di taxi dal centro. Il tempio più importante del buddhismo coreano, fondato nel 528 e ricostruito nell'VIII secolo: terrazze di pietra a secco, i due pagoda <strong>Seokgatap</strong> e <strong>Dabotap</strong> e, a fine ottobre, <strong>il viale d'accesso che diventa un tunnel di aceri rossi</strong>. Alle 9 è quasi vuoto.</p>\n        <p><em>Cosa portare</em>: passeggino per il viale d'accesso e i cortili, <strong>marsupio per le due scalinate storiche</strong> (Cheongungyo e Baegungyo), che sono il pezzo forte del tempio e vanno salite.</p>\n        <p><strong>11:00 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Seokguram+Grotto+Gyeongju\" target=\"_blank\" rel=\"noopener\">SEOKGURAM GROTTO</a></strong>, la grotta artificiale con il Buddha di granito che guarda il mare — l'altra metà del sito UNESCO e, per molti, la cosa più bella di tutta la Corea. Si sale in navetta dal parcheggio di Bulguksa, poi <strong>500 metri di sentiero in leggera salita nel bosco</strong>, con vista sulla vallata. Marsupio, dieci minuti di camminata: si fa.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 12:30</span>\n        <p>Una delle <em>ssambap-jip</em> storiche fra Bulguksa e il centro. <strong>Piatto tipico: il <em>ssambap</em> di Gyeongju</strong> — riso, grigliata di maiale o pesce e fino a venti <em>banchan</em> stagionali da avvolgere in foglie di perilla, lattuga e cavolo. Bilanciato, condivisibile, e la bimba pesca dai contorni non piccanti.</p>\n        <p><strong>Dolce d'obbligo</strong>: <em>hwangnam-ppang</em>, il pane dolce ripieno di pasta di fagioli rossi che è il souvenir gastronomico della città.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio</span>\n        <p><strong>14:30 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gyochon+Hanok+Village+Gyeongju\" target=\"_blank\" rel=\"noopener\">GYOCHON HANOK VILLAGE</a></strong>, il villaggio storico della famiglia Choi, i grandi proprietari terrieri di Gyeongju per dodici generazioni. Si visita la loro casa padronale, si entra nella <strong>distilleria del <em>Gyeongju Beopju</em></strong> — il liquore di riso della corte di Silla, degustazione compresa — e si passeggia fra i muri di pietra e i tetti curvi. Accanto, il <strong>Gyeongju Hyanggyo</strong>, l'antica scuola confuciana.</p>\n        <p><em>Accessibilità: ottima.</em> Il villaggio è pianeggiante, i vialetti sono larghi e in terra battuta o lastricati. Si arriva a piedi al ponte di stasera.</p>\n        <p>Da Gyochon all'hotel sono dieci minuti a piedi: chi vuole un'ora di pausa prima della sera la prende senza taxi.</p>\n        <p><em>Alternativa per il Nucleo 2</em>: <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gyochon+Hanok+Village+Gyeongju\" target=\"_blank\" rel=\"noopener\">Gyochon Hanok Village</a>, il villaggio della famiglia Choi con la distilleria del <strong>Gyeongju Beopju</strong>, il liquore di riso della corte di Silla — degustazione e visita.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata</span>\n        <p><strong>18:30</strong> — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Woljeonggyo+Bridge+Gyeongju\" target=\"_blank\" rel=\"noopener\">WOLJEONGGYO BRIDGE</a> illuminato: il grande ponte coperto in legno ricostruito sul fiume Namcheon, con tetto a pagoda e padiglioni alle estremità, che di notte riflette la luce dorata sull'acqua. <strong>Interamente in legno, largo e in piano: si attraversa in passeggino senza il minimo ostacolo.</strong> A fianco, Gyochon illuminato.</p>\n        <p><strong>Cena</strong>: <em>hanjeongsik</em> in una casa tradizionale a Gyochon — il banchetto coreano completo in versione provinciale, più rustico e più abbondante di quello di Seul, con il <em>beopju</em> in abbinamento.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <p>Regola della giornata: templi la mattina, hotel il pomeriggio, illuminazioni la sera. È lo schema che permette di vedere Gyeongju senza mai correre. Il salto di Seokguram non è una rinuncia: Bulguksa da solo è la visita che conta.</p>\n        <ul><li><strong>Stasera valigie pronte</strong>: domani, dopo il museo, si va a Busan. Se usate il servizio di consegna bagagli, attivate ora la tratta Gyeongju → Haeundae.</li><li>Ultimo acquisto di <em>hwangnam-ppang</em>: si conserva 4–5 giorni.</li></ul>\n      </div>\n    ", "links": [{"t": "Bulguksa Temple", "h": "https://www.google.com/maps/search/?api=1&amp;query=Bulguksa+Temple+Gyeongju", "site": false}, {"t": "Seokguram Grotto", "h": "https://www.google.com/maps/search/?api=1&amp;query=Seokguram+Grotto+Gyeongju", "site": false}, {"t": "Gyochon Hanok Village", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gyochon+Hanok+Village+Gyeongju", "site": false}, {"t": "Woljeonggyo Bridge", "h": "https://www.google.com/maps/search/?api=1&amp;query=Woljeonggyo+Bridge+Gyeongju", "site": false}], "hotels": [["Tutti e sette", "Hwangridan Stay · Booking 6224.977.751 · PIN 0657", "https://www.google.com/maps/search/?api=1&query=Hwangridan+Stay+Gyeongju"]]}, {"id": "08", "iso": "2026-10-22", "date": "Giovedì 22 ottobre", "title": "Il museo di Silla, poi Busan: il grande magazzino più grande del mondo", "flag": "", "acc": "red", "sec": "busan", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 399\" role=\"img\" aria-label=\"Itinerario del giorno 08\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"399\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><path d=\"M0,399 L0,247 Q162,319 267,247 Q360,200 452,239 L580,207 L580,399 Z\" fill=\"#DCEAF2\" opacity=\".75\"/><text x=\"566\" y=\"385\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">MAR DEL GIAPPONE</text><circle cx=\"290.0\" cy=\"143.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"296.0\" y=\"147.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gwangalli</text><circle cx=\"78.5\" cy=\"309.5\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"84.5\" y=\"313.0\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Jagalchi</text><circle cx=\"30.2\" cy=\"306.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"36.2\" y=\"310.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gamcheon</text><circle cx=\"543.8\" cy=\"39.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"549.8\" y=\"43.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Haedong Yonggungsa</text><circle cx=\"48.3\" cy=\"369.7\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"54.3\" y=\"373.2\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Songdo</text><circle cx=\"106.3\" cy=\"255.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"112.3\" y=\"258.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Busan Station</text><path d=\"M 387.9,123.2 L 395.9,117.4 L 319.0,96.8 L 392.5,127.0\" fill=\"none\" stroke=\"#9C2E22\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"387.9\" cy=\"123.2\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"387.9\" y=\"126.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"400.9\" y=\"127.2\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">HaeRium · check-in</text><circle cx=\"395.9\" cy=\"117.4\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"395.9\" y=\"121.0\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"408.9\" y=\"121.4\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Haeundae Market · pranzo</text><circle cx=\"319.0\" cy=\"96.8\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"319.0\" y=\"100.39999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"332.0\" y=\"100.8\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Shinsegae Centum</text><circle cx=\"392.5\" cy=\"127.0\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"392.5\" y=\"130.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"405.5\" y=\"131.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Lungomare · sera</text></svg><div class=\"mapcap\">Itinerario del giorno · Busan</div></div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · Gyeongju</span>\n        <p>Ultima colazione fra gli hanok, check-out con le valigie in deposito, e un'ora e mezza al museo prima di partire.</p>\n        \n        <p><strong>09:00</strong> — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gyeongju+National+Museum\" target=\"_blank\" rel=\"noopener\">GYEONGJU NATIONAL MUSEUM</a>, il museo che dà senso a tutto quello che avete visto: le corone d'oro di Silla, i gioielli delle tombe e, nel cortile, la <strong>Campana del re Seongdeok</strong> (l'<em>Emille Bell</em>), la più grande campana in bronzo della Corea. Sale climatizzate, ascensori, percorso in piano.</p>\n        <p><strong>11:00 — trasferimento Gyeongju → Busan, in treno.</strong> Due taxi dall'hotel alla <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gyeongju+Station+KTX\" target=\"_blank\" rel=\"noopener\">stazione KTX di Gyeongju</a> (20 minuti), poi <strong>KTX 023 delle 11:50, arrivo a Busan alle 12:24</strong> — <span class=\"ok\">biglietti emessi ✓</span> carrozza 18, posti 1C–1D e 2A–2D, ₩10.100 a testa. Da Busan Station a Haeundae: <strong>due taxi, 30–40 minuti</strong> (la metro, linea 1 poi 2, è un'ora con un cambio e le valigie: no).</p>\n        <p><strong>13:10 ca.</strong> — Arrivo a Haeundae, deposito bagagli, check-in appena disponibile.</p>\n        <div class=\"note\"><p><strong>Le valigie.</strong> Con tre spezzoni — taxi, treno, taxi — il <strong>servizio di consegna bagagli hotel-to-hotel</strong> smette di essere un'opzione e diventa la scelta giusta: ritiro all'hanok la mattina, consegna all'HaeRium in giornata, e voi viaggiate con gli zaini. Attivatelo la sera prima.</p></div>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 13:00 · Haeundae</span>\n        <p><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Haeundae+Market+Busan\" target=\"_blank\" rel=\"noopener\">Haeundae Market</a>, 8 minuti a piedi: arcata pedonale al coperto e in piano, con banchi di street food. Da provare i <strong><em>ssiat hotteok</em></strong>, la frittella dolce ripiena di semi e noci che è specialità assoluta di Busan, e gli <strong><em>eomuk</em></strong> di Samjin, che qui è nata. Alternativa seduta: <strong><em>milmyeon</em></strong>, i noodles freddi di farina di grano nati proprio a Busan.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio</span>\n        <div class=\"warn\"><p><strong>Perché Shinsegae è oggi.</strong> Chiude il quarto lunedì di ogni mese; il giovedì è pienamente aperto, e dopo un trasferimento un grande magazzino al coperto è il pomeriggio perfetto.</p></div>\n        <p><strong>15:00 — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Shinsegae+Centum+City+Busan\" target=\"_blank\" rel=\"noopener\">SHINSEGAE CENTUM CITY</a></strong>, quindici minuti di taxi: il grande magazzino più grande del mondo secondo il Guinness dei primati. Quattordici piani, moda internazionale e coreana, un piano intero di K-Beauty, food hall interrata monumentale, cinema, libreria, pista di ghiaccio, <strong>nursing room di livello ospedaliero</strong> e un giardino sul tetto. È il pomeriggio ideale dopo un trasferimento: tutto al coperto, nessuna decisione da prendere.</p>\n        <p><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Spa+Land+Centum+City+Busan\" target=\"_blank\" rel=\"noopener\">SPA LAND</a> all'interno: il <em>jjimjilbang</em> più raffinato della Corea, 22 vasche alimentate da due sorgenti diverse e sale tematiche. <strong>Riservato ai maggiori di una certa età (in genere 13 anni): verificate prima.</strong> Esperienza per il Nucleo 2 o per i genitori a turno — un'ora e mezza basta.</p>\n        <p>Accanto: il <strong>Busan Cinema Center</strong>, con la tettoia LED che si accende al tramonto.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata</span>\n        <p><strong>Cena</strong>: grigliata di anguilla di mare (<em>jangeo gui</em>) o <em>hoe</em> sul lungomare; per un tavolo tranquillo con la bimba, i ristoranti degli hotel sul lungomare.</p>\n        <p><strong>Passeggiata</strong>: il lungomare di <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Haeundae+Beach+Busan\" target=\"_blank\" rel=\"noopener\">Haeundae</a>, 1,5 km di percorso pedonale illuminato fra la sabbia e le torri, con i grattacieli di Marine City accesi sullo sfondo. Completamente in piano, largo, senza traffico. Dongbaekseom, a dieci minuti, la lasciamo per domenica mattina.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>Haeundae è il quartiere più internazionale della Corea: insegne in inglese, marciapiedi ampi, farmacie e minimarket ovunque.</li>\n          <li>Fate lo <strong>shopping pesante oggi</strong> allo Shinsegae, tax refund in loco: restano due giorni per non pensarci più.</li>\n          <li><strong>Domani il tour della costa</strong>: ritrovo alle 9:30 a Haeundae Station uscita 5, bandierina TOURSTORY. Preparate stasera la borsa della bimba per la giornata intera.</li>\n        </ul>\n      </div>\n      \n    ", "links": [{"t": "Gyeongju National Museum", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gyeongju+National+Museum", "site": false}, {"t": "stazione KTX di Gyeongju", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gyeongju+Station+KTX", "site": false}, {"t": "Haeundae Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Haeundae+Market+Busan", "site": false}, {"t": "Shinsegae Centum City", "h": "https://www.google.com/maps/search/?api=1&amp;query=Shinsegae+Centum+City+Busan", "site": false}, {"t": "Spa Land", "h": "https://www.google.com/maps/search/?api=1&amp;query=Spa+Land+Centum+City+Busan", "site": false}, {"t": "Haeundae", "h": "https://www.google.com/maps/search/?api=1&amp;query=Haeundae+Beach+Busan", "site": false}], "hotels": [["Nucleo 1", "HaeRium Haeundae · Booking 6738.465.144 · PIN 1315", "https://www.google.com/maps/search/?api=1&query=HaeRium+Haeundae+Busan"], ["Nucleo 2", "HaeRium Haeundae · Booking 6972.255.244 · PIN 0464", "https://www.google.com/maps/search/?api=1&query=HaeRium+Haeundae+Busan"]]}, {"id": "09", "iso": "2026-10-23", "date": "Venerdì 23 ottobre", "title": "Il tour della costa: Sky Capsule, la passerella di vetro, i due villaggi sul mare", "flag": "", "acc": "red", "sec": "busan", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 399\" role=\"img\" aria-label=\"Itinerario del giorno 09\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"399\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><path d=\"M0,399 L0,247 Q162,319 267,247 Q360,200 452,239 L580,207 L580,399 Z\" fill=\"#DCEAF2\" opacity=\".75\"/><text x=\"566\" y=\"385\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">MAR DEL GIAPPONE</text><circle cx=\"392.1\" cy=\"127.0\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"398.1\" y=\"130.5\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Spiaggia Haeundae</text><circle cx=\"290.4\" cy=\"143.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"296.4\" y=\"146.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gwangalli</text><circle cx=\"543.8\" cy=\"39.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"549.8\" y=\"43.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Haedong Yonggungsa</text><circle cx=\"106.0\" cy=\"255.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"112.0\" y=\"259.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Busan Station</text><circle cx=\"78.5\" cy=\"309.5\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"84.5\" y=\"313.0\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Jagalchi</text><circle cx=\"467.2\" cy=\"130.5\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"473.2\" y=\"134.0\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Cheongsapo</text><path d=\"M 389.7,113.8 L 414.6,125.2 L 304.1,308.6 L 56.5,364.5 L 30.2,306.6 L 352.7,134.7\" fill=\"none\" stroke=\"#9C2E22\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"389.7\" cy=\"113.8\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"389.7\" y=\"117.39999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"376.7\" y=\"117.8\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Haeundae Station · pickup</text><circle cx=\"414.6\" cy=\"125.2\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"414.6\" y=\"128.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"427.6\" y=\"129.2\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Blue Line Park · Sky Capsule</text><circle cx=\"304.1\" cy=\"308.6\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"304.1\" y=\"312.20000000000005\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"317.1\" y=\"312.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Oryukdo Skywalk</text><circle cx=\"56.5\" cy=\"364.5\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"56.5\" y=\"368.1\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"69.5\" y=\"368.5\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Huinnyeoul</text><circle cx=\"30.2\" cy=\"306.6\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"30.2\" y=\"310.20000000000005\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">5</text><text x=\"43.2\" y=\"310.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Gamcheon</text><circle cx=\"352.7\" cy=\"134.7\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"352.7\" y=\"138.29999999999998\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">6</text><text x=\"339.7\" y=\"138.7\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">The Bay 101 · sera</text></svg><div class=\"mapcap\">Itinerario del giorno · Busan</div></div>\n      <div class=\"note\"><p><strong>Tour prenotato ✓</strong> — <a class=\"l l-site\" href=\"https://www.booking.com/attractions/kr/pre4mhgftndf-busans-coastal-charm-culture-sky-capsule-and-gamcheon-village.it.html\" target=\"_blank\" rel=\"noopener\">“Busan Top attrazioni costiere con Gamcheon Village &amp; Sky Capsule”</a>, operatore TOURSTORY (tel. +82 10 9650 8388), pacchetto <strong>“Sky Capsule Tour”</strong> con biglietto della capsula incluso e garantito. <strong>Booking.com BK445117828350758 · PIN 8122</strong> · ref. Viator 1455951585 · 6 adulti + la bimba (gratis, in braccio) · guida in inglese · <strong>311,36 € pagati</strong>. <strong>Ritrovo alle 9:30 a Haeundae Station, uscita 5</strong> (partenza 9:40; la guida ha una bandierina TOURSTORY): dall'HaeRium sono cinque minuti a piedi. Durata 9–10 ore, si torna allo stesso punto verso le 19:00. Include bus climatizzato, guida e tutti gli ingressi; <strong>pasti esclusi</strong>. Cancellazione gratuita fino alle 9:40 del 22 ottobre. <em>Da fare</em>: avvisare l'operatore del passeggino (lo chiedono espressamente) con un messaggio dalla pagina della prenotazione.</p></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · Blue Line Park, 2 ore</span>\n        <p>Prima tappa, a cinque minuti dal ritrovo: <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Haeundae+Blue+Line+Park+Mipo+Station\" target=\"_blank\" rel=\"noopener\">HAEUNDAE BLUE LINE PARK</a>, l'ex linea ferroviaria costiera diventata l'attrazione più bella di Busan. Si sale sulla <strong>Sky Capsule</strong>, la cabina pastello sospesa che avanza a passo d'uomo a filo d'acqua da Mipo a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Cheongsapo+Busan\" target=\"_blank\" rel=\"noopener\">Cheongsapo</a>: <strong>quattro posti per capsula</strong>, quindi vi dividete in due più due (un genitore con la bimba in braccio, è ammesso), e se il gruppo non è pieno la guida vi mette con altri ospiti. Il tempo libero che resta — un'ora abbondante — si spende sul <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Cheongsapo+Daritdol+Skywalk+Busan\" target=\"_blank\" rel=\"noopener\">Daritdol Skywalk</a>, la passerella di vetro sul mare, e con uno <em>ssiat hotteok</em> dalle bancarelle del porto. <strong>Passeggino: perfetto</strong>, il sentiero costiero è in piano.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Tarda mattinata · Oryukdo Skywalk, 30 minuti</span>\n        <p>Bus di 25 minuti verso sud fino a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Oryukdo+Skywalk+Busan\" target=\"_blank\" rel=\"noopener\">ORYUKDO SKYWALK</a>: una piattaforma con il pavimento di vetro che sporge dalla scogliera a 35 metri sul mare, davanti ai cinque (o sei, dipende dalla marea: da qui il nome) isolotti di Oryukdo. Si entra con i copriscarpe, è tutto in piano, dieci minuti sul vetro e il resto a guardare il mare aperto. Ingresso gratuito.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · ~13:00 · non incluso</span>\n        <p>La guida ferma il gruppo in un ristorante locale, in genere nella zona di Nampo. Il piatto giusto, qui, è il <strong><em>dwaeji gukbap</em></strong>, la zuppa di riso e maiale che è il piatto identitario di Busan, nata nel dopoguerra: non piccante alla base, il peperoncino si aggiunge a parte, <strong>ottima anche per la bimba</strong>. Quaranta minuti e si riparte.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio · i due villaggi</span>\n        <p><strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Huinnyeoul+Culture+Village+Busan\" target=\"_blank\" rel=\"noopener\">HUINNYEOUL CULTURE VILLAGE</a></strong>, un'ora e dieci: il borgo di case bianche aggrappato alla scogliera di Yeongdo, con i vicoli stretti a strapiombo sul mare e la passeggiata in basso lungo l'acqua. <strong>Marsupio</strong>: le scalinate fra il livello alto e quello basso sono ripide. Chi preferisce resta sulla via alta, che è in piano e ha la vista migliore.</p>\n        <p><strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gamcheon+Culture+Village+Busan\" target=\"_blank\" rel=\"noopener\">GAMCHEON CULTURE VILLAGE</a></strong>, un'ora: l'ex quartiere dei rifugiati di guerra sul fianco della collina, ridipinto a blocchi di colore e diventato il volto pop di Busan — case a gradoni, murales, caffè con terrazza e il Piccolo Principe seduto sul muretto a guardare il mare di tetti. La guida consegna la mappa-percorso con i timbri. <strong>Marsupio, passeggino sul bus</strong>: è tutto in pendenza. Un'ora è poca per i vicoli, giusta per la strada principale e il belvedere, che è quello che conta.</p>\n        <p><strong>~19:00</strong> — Rientro in bus a Haeundae Station. Doccia in hotel e mezz'ora di pausa.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata</span>\n        <p><strong>20:00</strong> — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=The+Bay+101+Busan\" target=\"_blank\" rel=\"noopener\">THE BAY 101</a> / Marine City, dieci minuti di taxi: il punto da cui si scatta <em>la</em> fotografia di Busan, con lo skyline di grattacieli riflesso nell'acqua ferma della darsena. Rito locale: pollo fritto e birra sul molo, con la vista davanti. <em>Accessibilità perfetta</em>: piazzale e passeggiata sul porticciolo in piano. Se la giornata ha pesato, cena a Haeundae sotto l'hotel e The Bay 101 domani sera prima dei droni, che sono a dieci minuti da lì.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li><strong>Da portare</strong>: e-ticket Viator sul telefono (ref. 1455951585), passeggino leggero + marsupio, borsa della bimba per la giornata intera (latte, snack, cambio), giacca a vento per la passerella di Oryukdo, contanti per il pranzo e gli hotteok.</li>\n          <li>È l'unica giornata del viaggio con un ritmo imposto da altri: cinque tappe, un'ora ciascuna. Il prezzo da pagare per la capsula. Domani, per compensare, si va piano.</li>\n          <li>Lo <strong>shopping pesante</strong> è stato ieri allo Shinsegae: oggi mani libere.</li>\n        </ul>\n      </div>\n    ", "links": [{"t": "Il tour della costa · Booking.com", "h": "https://www.booking.com/attractions/kr/pre4mhgftndf-busans-coastal-charm-culture-sky-capsule-and-gamcheon-village.it.html", "site": true}, {"t": "Haeundae Blue Line Park", "h": "https://www.google.com/maps/search/?api=1&amp;query=Haeundae+Blue+Line+Park+Mipo+Station", "site": false}, {"t": "Cheongsapo", "h": "https://www.google.com/maps/search/?api=1&amp;query=Cheongsapo+Busan", "site": false}, {"t": "Daritdol Skywalk", "h": "https://www.google.com/maps/search/?api=1&amp;query=Cheongsapo+Daritdol+Skywalk+Busan", "site": false}, {"t": "Oryukdo Skywalk", "h": "https://www.google.com/maps/search/?api=1&amp;query=Oryukdo+Skywalk+Busan", "site": false}, {"t": "Huinnyeoul Culture Village", "h": "https://www.google.com/maps/search/?api=1&amp;query=Huinnyeoul+Culture+Village+Busan", "site": false}, {"t": "Gamcheon Culture Village", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gamcheon+Culture+Village+Busan", "site": false}, {"t": "The Bay 101", "h": "https://www.google.com/maps/search/?api=1&amp;query=The+Bay+101+Busan", "site": false}], "hotels": [["Nucleo 1", "HaeRium Haeundae · Booking 6738.465.144 · PIN 1315", "https://www.google.com/maps/search/?api=1&query=HaeRium+Haeundae+Busan"], ["Nucleo 2", "HaeRium Haeundae · Booking 6972.255.244 · PIN 0464", "https://www.google.com/maps/search/?api=1&query=HaeRium+Haeundae+Busan"]]}, {"id": "10", "iso": "2026-10-24", "date": "Sabato 24 ottobre", "title": "Il mercato del pesce con calma, e i droni sopra Gwangalli", "flag": "", "acc": "red", "sec": "busan", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 399\" role=\"img\" aria-label=\"Itinerario del giorno 10\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"399\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><path d=\"M0,399 L0,247 Q162,319 267,247 Q360,200 452,239 L580,207 L580,399 Z\" fill=\"#DCEAF2\" opacity=\".75\"/><text x=\"566\" y=\"385\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">MAR DEL GIAPPONE</text><circle cx=\"392.1\" cy=\"127.0\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"398.1\" y=\"130.5\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Spiaggia Haeundae</text><circle cx=\"106.0\" cy=\"255.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"112.0\" y=\"259.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Busan Station</text><circle cx=\"30.2\" cy=\"306.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"36.2\" y=\"310.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gamcheon</text><circle cx=\"543.8\" cy=\"39.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"549.8\" y=\"43.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Haedong Yonggungsa</text><circle cx=\"317.7\" cy=\"96.7\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"323.7\" y=\"100.2\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Shinsegae Centum</text><path d=\"M 78.5,309.5 L 72.5,296.3 L 48.3,369.8 L 290.4,143.2\" fill=\"none\" stroke=\"#9C2E22\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"78.5\" cy=\"309.5\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"78.5\" y=\"313.1\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"91.5\" y=\"313.5\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Jagalchi</text><circle cx=\"72.5\" cy=\"296.3\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"72.5\" y=\"299.90000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"85.5\" y=\"300.3\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Gukje & BIFF</text><circle cx=\"48.3\" cy=\"369.8\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"48.3\" y=\"373.40000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"61.3\" y=\"373.8\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Songdo · facoltativo</text><circle cx=\"290.4\" cy=\"143.2\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"290.4\" y=\"146.79999999999998\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"303.4\" y=\"147.2\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Gwangalli · droni 19:00</text></svg><div class=\"mapcap\">Itinerario del giorno · Busan</div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · dalle 10:00</span>\n        <p>Sveglia senza orario, colazione lunga. Poi 40 minuti di taxi per <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Jagalchi+Fish+Market+Busan\" target=\"_blank\" rel=\"noopener\">JAGALCHI MARKET</a>: <strong>il più grande mercato ittico della Corea</strong>, gestito storicamente dalle <em>jagalchi ajumma</em>, le donne del pesce. Piano terra: vasche di polpi vivi, granchi reali, alghe. Primo piano: si sceglie il pesce al banco e lo si fa cucinare al ristorante del piano superiore.</p>\n        <p>A 5 minuti a piedi, tutto contiguo e pedonale: <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=BIFF+Square+Busan\" target=\"_blank\" rel=\"noopener\">BIFF SQUARE</a>, la piazza del Festival del Cinema con le impronte dei registi e le bancarelle di <em>ssiat hotteok</em>, e <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gukje+Market+Busan\" target=\"_blank\" rel=\"noopener\">GUKJE MARKET</a>, il grande mercato coperto nato dai profughi della guerra.</p>\n        <p><em>Accessibilità media</em>: tutto in piano ma corridoi stretti, pavimenti bagnati, folla. Col passeggino è fattibile nelle arcate principali; nei vicoli usate il marsupio.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 12:30</span>\n        <p><strong>Jagalchi, primo piano</strong>: si compra al banco e si sale. <strong>Piatto tipico: <em>hoe</em></strong> (crudo tagliato spesso, con soia e wasabi o <em>chogochujang</em>) e il <strong><em>maeuntang</em></strong>, la zuppa piccante ricavata dalle lische. Per la bimba, riso e il pesce alla griglia che fanno in ogni banco.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio · libero</span>\n        <p>Il pomeriggio è vuoto apposta: dopo il tour di ieri, è la mezza giornata di riserva della tappa. Tre opzioni, nessuna obbligatoria:</p>\n        <ul>\n          <li><strong>Rientro a Haeundae e spiaggia</strong>: la passerella di <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dongbaekseom+Island+Nurimaru+APEC+House+Busan\" target=\"_blank\" rel=\"noopener\">Dongbaekseom</a> (in piano, 40 minuti ad anello) e un caffè con vista a Marine City.</li>\n          <li><strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Busan+Air+Cruise+Songdo+Cable+Car\" target=\"_blank\" rel=\"noopener\">Songdo e il Busan Air Cruise</a></strong>, dieci minuti da Jagalchi: la cabinovia sul mare aperto con le cabine dal fondo di vetro e la passerella costiera. Col passeggino si fa tutto. Da Songdo a Gwangalli sono 45 minuti di taxi: si riparte entro le 16:30.</li>\n          <li><strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=BUSAN+X+the+SKY+Haeundae\" target=\"_blank\" rel=\"noopener\">BUSAN X the SKY</a></strong>, il ponte panoramico al 98°–100° piano della torre LCT, tutto al coperto: la scelta se piove.</li>\n        </ul>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata · la serata dei droni</span>\n        <ul>\n          <li><strong>17:30</strong> — Trasferimento a <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Gwangalli+Beach+Busan\" target=\"_blank\" rel=\"noopener\">GWANGALLI</a> (15 minuti di taxi da Haeundae), la spiaggia affacciata sul <strong>Gwangandaegyo</strong>, il “Diamond Bridge”.</li>\n          <li><strong>17:45</strong> — Cena presto su uno dei rooftop del lungomare, con il ponte davanti.</li>\n          <li><strong>19:00</strong> — <a class=\"l l-site\" href=\"https://www.gwangallimdrone.co.kr/en/home\" target=\"_blank\" rel=\"noopener\">GWANGALLI M DRONE LIGHT SHOW</a>. Ogni sabato dell'anno oltre mille droni disegnano una coreografia di 10–12 minuti sopra il mare, con un tema diverso ogni settimana. Ingresso libero.</li>\n        </ul>\n        <div class=\"warn\"><p><strong>Orari di ottobre: 19:00 e 21:00</strong> (da marzo a settembre sono 20:00 e 22:00 — non fidatevi delle guide scritte in estate). <strong>Lo spettacolo delle 19:00 è quello giusto per la bimba.</strong> Lo show può essere annullato per pioggia o vento, con avviso il giorno prima o il giorno stesso: <a class=\"l l-site\" href=\"https://www.busan.go.kr/eng/bsnews01/1732958\" target=\"_blank\" rel=\"noopener\">controllate nel pomeriggio</a>.</p></div>\n        <p><em>Accessibilità totale</em>: il lungomare di Gwangalli è una passeggiata pedonale piana e larghissima, senza scalinate.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <ul>\n          <li>Jagalchi chiude in genere il 1° e il 3° martedì del mese: il sabato è sicuro, ma è anche il giorno più affollato — entro le 11:00 si gira bene.</li>\n          <li>Gwangalli il sabato sera è affollata: arrivate entro le 18:15 per prendere posto lato mare.</li>\n          <li>Il ritorno in taxi subito dopo lo show è il momento peggiore: aspettate 20 minuti in un caffè, o prenotate su Kakao T in anticipo.</li>\n          <li>Se lo show viene cancellato, il piano B è a 200 metri: i caffè-panorama con vista sul ponte restano aperti fino a tardi.</li>\n          <li>Domani niente sveglia obbligata: Yonggungsa all'alba è solo per chi vuole.</li>\n        </ul>\n      </div>\n    ", "links": [{"t": "Jagalchi Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Jagalchi+Fish+Market+Busan", "site": false}, {"t": "Biff Square", "h": "https://www.google.com/maps/search/?api=1&amp;query=BIFF+Square+Busan", "site": false}, {"t": "Gukje Market", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gukje+Market+Busan", "site": false}, {"t": "Dongbaekseom", "h": "https://www.google.com/maps/search/?api=1&amp;query=Dongbaekseom+Island+Nurimaru+APEC+House+Busan", "site": false}, {"t": "Songdo e il Busan Air Cruise", "h": "https://www.google.com/maps/search/?api=1&amp;query=Busan+Air+Cruise+Songdo+Cable+Car", "site": false}, {"t": "BUSAN X the SKY", "h": "https://www.google.com/maps/search/?api=1&amp;query=BUSAN+X+the+SKY+Haeundae", "site": false}, {"t": "Gwangalli", "h": "https://www.google.com/maps/search/?api=1&amp;query=Gwangalli+Beach+Busan", "site": false}, {"t": "Gwangalli M Drone Light Show", "h": "https://www.gwangallimdrone.co.kr/en/home", "site": true}, {"t": "controllate nel pomeriggio", "h": "https://www.busan.go.kr/eng/bsnews01/1732958", "site": true}], "hotels": [["Nucleo 1", "HaeRium Haeundae · Booking 6738.465.144 · PIN 1315", "https://www.google.com/maps/search/?api=1&query=HaeRium+Haeundae+Busan"], ["Nucleo 2", "HaeRium Haeundae · Booking 6972.255.244 · PIN 0464", "https://www.google.com/maps/search/?api=1&query=HaeRium+Haeundae+Busan"]]}, {"id": "11", "iso": "2026-10-25", "date": "Domenica 25 ottobre", "title": "Mattina libera (o l'alba sul tempio), il treno, Seoul Forest e Seongsu", "flag": "", "acc": "jade", "sec": "rientro", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 399\" role=\"img\" aria-label=\"Itinerario del giorno 11\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"399\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><path d=\"M0,399 L0,247 Q162,319 267,247 Q360,200 452,239 L580,207 L580,399 Z\" fill=\"#DCEAF2\" opacity=\".75\"/><text x=\"566\" y=\"385\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">MAR DEL GIAPPONE</text><circle cx=\"392.5\" cy=\"127.0\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"398.5\" y=\"130.5\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Spiaggia Haeundae</text><circle cx=\"290.0\" cy=\"143.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"296.0\" y=\"147.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gwangalli</text><circle cx=\"78.5\" cy=\"309.5\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"84.5\" y=\"313.0\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Jagalchi</text><circle cx=\"30.2\" cy=\"306.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"36.2\" y=\"310.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gamcheon</text><circle cx=\"319.0\" cy=\"96.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"325.0\" y=\"100.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Shinsegae Centum</text><circle cx=\"48.3\" cy=\"369.7\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"54.3\" y=\"373.2\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Songdo</text><path d=\"M 543.8,39.6 L 387.9,123.2 L 106.3,255.2\" fill=\"none\" stroke=\"#9C2E22\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"543.8\" cy=\"39.6\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"543.8\" y=\"43.2\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"530.8\" y=\"43.6\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Yonggungsa · 07:30</text><circle cx=\"387.9\" cy=\"123.2\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"387.9\" y=\"126.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"400.9\" y=\"127.2\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Hotel · check-out</text><circle cx=\"106.3\" cy=\"255.2\" r=\"9.5\" fill=\"#9C2E22\"/><text x=\"106.3\" y=\"258.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"119.3\" y=\"259.2\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">KTX 10:28 → Seul</text></svg><div class=\"mapcap\">Itinerario del giorno · Busan</div></div></div>\n      <p class=\"soft\" style=\"font-size:14px;margin-top:8px\">Il pomeriggio si è a Seul: Seongsu e poi Myeongdong, sulla mappa della capitale.</p>\n      <div class=\"blk\"><span class=\"lab\">Mattina · per chi vuole, presto</span>\n        <p><strong>Oggi la sveglia non è obbligatoria</strong>: chi preferisce dorme, fa colazione con calma e alle 10:00 è pronto. Per chi invece vuole chiudere Busan con il suo tempio più bello, <strong>07:30</strong> — <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Haedong+Yonggungsa+Temple+Busan\" target=\"_blank\" rel=\"noopener\">HAEDONG YONGGUNGSA TEMPLE</a>, costruito direttamente sulle rocce a picco sul mare — <strong>una rarità assoluta in Corea, dove i templi stanno in montagna</strong>. Arrivare all'alba significa averlo quasi per sé: alle 10 è un fiume di gente. 25 minuti di taxi da Haeundae.</p>\n        <div class=\"note\"><p><strong>I 108 gradini.</strong> Si scende una scalinata di 108 scalini fino al livello del mare e si risale — un numero che nel buddhismo corrisponde ai 108 desideri terreni da lasciarsi alle spalle. <strong>Marsupio, passeggino in auto</strong>: venti minuti di discesa e risalita con qualche sosta. Alle 7:30 del mattino la scalinata è vuota e la luce viene dal mare.</p></div>\n        \n        <p><strong>09:15</strong> — Rientro in hotel. Dongbaekseom resta per un'altra volta: la passerella di <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dongbaekseom+Island+Nurimaru+APEC+House+Busan\" target=\"_blank\" rel=\"noopener\">Dongbaekseom</a>, a dieci minuti dall'hotel, per il saluto al mare. <strong>09:30</strong> check-out, due taxi per <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Busan+Station+KTX\" target=\"_blank\" rel=\"noopener\">Busan Station</a> (30 minuti, in stazione entro le 10:10). Per chi è andato a Yonggungsa i tempi sono stretti: rientro in hotel entro le 9:15, valigie già pronte la sera prima.</p>\n        <p><strong>10:28 — KTX 030 Busan → Seoul, arrivo 13:04.</strong> <span class=\"ok\">Biglietti emessi ✓</span> carrozza 9, posti 6A–6B e 7A–7D, ₩53.600 a testa. Comprate le <em>dosirak</em> di stazione per il treno: quelle di Busan sono ottime.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo</span>\n        <p>A bordo, con le <em>dosirak</em> di Busan, oppure alle 13:15 a Seoul Station prima di partire per Seongsu.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pomeriggio · Seul, dalla stazione a Seongsu</span>\n        <p><strong>13:04</strong> — Arrivo a Seoul Station. Le valigie fanno tre minuti di taxi fino al Courtyard e al Koreana (o viaggiano col servizio bagagli); voi, dopo un pranzo veloce in stazione, andate dritti a <strong><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Seoul+Forest+Seongsu\" target=\"_blank\" rel=\"noopener\">SEOUL FOREST</a></strong> (서울숲), 25 minuti di taxi: il grande parco sul fiume con il recinto dei cervi, i prati, il bosco di ginkgo che a fine ottobre è giallo, i vialetti in piano. Un'ora e mezza di passeggiata lenta, la bimba nel passeggino o fra i cervi. Dal lato est del parco, dieci minuti a piedi, si entra a <strong>Seongsu-dong</strong>: l'ex quartiere delle concerie diventato il polo creativo della città, con le fabbriche di mattoni rossi riconvertite in flagship store. <strong>La domenica è tutto aperto</strong> — e il lunedì no, ecco perché è oggi.</p>\n        <ul>\n          <li><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=AMORE+Seongsu+Seoul\" target=\"_blank\" rel=\"noopener\">AMORE Seongsu</a> — la <em>beauty library</em> di Amorepacific nell'ex officina meccanica, dove si testano liberamente Sulwhasoo, Laneige, Hera, Innisfree. Ingresso libero, si scansiona un QR, e all'uscita si scelgono cinque campioni. Aperto fino alle 20:30.</li>\n          <li><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=LCDC+Seoul+Seongsu\" target=\"_blank\" rel=\"noopener\">LCDC Seoul</a>, ex tipografia oggi complesso di brand indipendenti; <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Daelim+Changgo+Gallery+Column+Seongsu\" target=\"_blank\" rel=\"noopener\">Daelim Changgo</a> per il caffè; attorno Ader Error e Musinsa Standard.</li>\n        </ul>\n        <p><strong>18:30</strong> — Taxi per Jung-gu, venti minuti: check-in al Courtyard e al Koreana, le stesse chiavi della prima settimana.</p>\n        <p><em>Cosa portare</em>: passeggino. Seongsu è pianeggiante con marciapiedi larghi.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Cena &amp; serata</span>\n        <p>Cena a Myeongdong, otto minuti a piedi: dopo una giornata iniziata alle sette a Yonggungsa, una <em>samgyetang</em> o un <em>korean fried chicken</em> senza cerimonie. <strong>Passeggiata</strong>: il <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Cheonggye+Plaza+Cheonggyecheon+Seoul\" target=\"_blank\" rel=\"noopener\">Cheonggyecheon</a> dalla rampa di Cheonggye Plaza — la passeggiata della prima sera, dieci giorni dopo.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Note di comfort &amp; logistica</span>\n        <div class=\"note\"><p><strong>Stanotte è finita l'ora legale in Italia: da oggi la Corea è avanti di 8 ore, non più 7.</strong> Ricordatelo per la telefonata ai nonni.</p></div>\n        <ul>\n          <li>Se usate il servizio bagagli, attivate ieri sera la tratta Haeundae → Courtyard: così da Seoul Station andate a Seongsu con le mani libere.</li>\n          <li><strong>Nucleo 2: domani sera è l'ultima occasione per il duty free.</strong> Gli acquisti al Lotte Duty Free Myeongdong si ritirano in aeroporto e vanno fatti <strong>almeno 24 ore prima del volo</strong>, quindi entro lunedì sera.</li>\n        </ul>\n      </div>\n      \n    ", "links": [{"t": "Haedong Yonggungsa Temple", "h": "https://www.google.com/maps/search/?api=1&amp;query=Haedong+Yonggungsa+Temple+Busan", "site": false}, {"t": "Dongbaekseom", "h": "https://www.google.com/maps/search/?api=1&amp;query=Dongbaekseom+Island+Nurimaru+APEC+House+Busan", "site": false}, {"t": "Busan Station", "h": "https://www.google.com/maps/search/?api=1&amp;query=Busan+Station+KTX", "site": false}, {"t": "Seoul Forest", "h": "https://www.google.com/maps/search/?api=1&amp;query=Seoul+Forest+Seongsu", "site": false}, {"t": "AMORE Seongsu", "h": "https://www.google.com/maps/search/?api=1&amp;query=AMORE+Seongsu+Seoul", "site": false}, {"t": "LCDC Seoul", "h": "https://www.google.com/maps/search/?api=1&amp;query=LCDC+Seoul+Seongsu", "site": false}, {"t": "Daelim Changgo", "h": "https://www.google.com/maps/search/?api=1&amp;query=Daelim+Changgo+Gallery+Column+Seongsu", "site": false}, {"t": "Cheonggyecheon", "h": "https://www.google.com/maps/search/?api=1&amp;query=Cheonggye+Plaza+Cheonggyecheon+Seoul", "site": false}], "hotels": [["Nucleo 1", "Courtyard Myeongdong · conf. 74682758", "https://www.google.com/maps/search/?api=1&query=Courtyard+by+Marriott+Seoul+Myeongdong"], ["Nucleo 2", "Koreana Hotel · Booking 6064.541.510 · PIN 8059", "https://www.google.com/maps/search/?api=1&query=Koreana+Hotel+Seoul"]]}, {"id": "12", "iso": "2026-10-26", "date": "Lunedì 26 ottobre", "title": "La giornata dello shopping: Apgujeong, Garosu-gil, Myeongdong · ultima sera insieme", "flag": "", "acc": "jade", "sec": "rientro", "html": "\n      <div class=\"mapwrap\"><svg class=\"mapsvg\" viewBox=\"0 0 580 420\" role=\"img\" aria-label=\"Itinerario del giorno 12\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"580\" height=\"420\" rx=\"3\" fill=\"#F4F7F3\" stroke=\"#DCE3DC\"/><polyline points=\"0.0,100.6 115.3,245.0 255.1,354.4 377.3,363.1 517.1,310.6 580.0,245.0\" fill=\"none\" stroke=\"#C7DCE8\" stroke-width=\"17\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"566\" y=\"408\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#7EA6BC\" font-family=\"ui-monospace,monospace\" letter-spacing=\"1.4\">FIUME HAN</text><circle cx=\"227.1\" cy=\"93.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"233.1\" y=\"97.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gyeongbokgung</text><circle cx=\"255.1\" cy=\"80.5\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"261.1\" y=\"84.0\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Bukchon</text><circle cx=\"242.5\" cy=\"115.1\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"248.5\" y=\"118.6\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Jogyesa</text><circle cx=\"339.6\" cy=\"150.9\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"345.6\" y=\"154.4\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">DDP</text><circle cx=\"307.5\" cy=\"135.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"313.5\" y=\"138.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Gwangjang</text><circle cx=\"501.4\" cy=\"247.2\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"507.4\" y=\"250.7\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seongsu</text><circle cx=\"57.7\" cy=\"328.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"63.7\" y=\"332.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">The Hyundai</text><circle cx=\"40.5\" cy=\"195.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"46.5\" y=\"199.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Hongdae</text><circle cx=\"545.1\" cy=\"312.8\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"551.1\" y=\"316.3\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Ttukseom</text><circle cx=\"305.0\" cy=\"273.9\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"311.0\" y=\"277.4\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Leeum</text><circle cx=\"205.1\" cy=\"202.6\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"211.1\" y=\"206.1\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">Seoul Station</text><circle cx=\"513.6\" cy=\"393.7\" r=\"3\" fill=\"#C3CEC6\"/><text x=\"519.6\" y=\"397.2\" font-size=\"9.5\" fill=\"#9AA8A1\" font-family=\"system-ui,sans-serif\">COEX</text><path d=\"M 447.2,323.3 L 446.9,320.3 L 387.8,350.0 L 254.4,163.6 L 76.9,317.2\" fill=\"none\" stroke=\"#136E5E\" stroke-width=\"2\" stroke-dasharray=\"6 5\" opacity=\".55\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"447.2\" cy=\"323.3\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"447.2\" y=\"326.90000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">1</text><text x=\"434.2\" y=\"327.3\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Dosan Park · Apgujeong</text><circle cx=\"446.9\" cy=\"320.3\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"446.9\" y=\"323.90000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">2</text><text x=\"433.9\" y=\"324.3\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Galleria</text><circle cx=\"387.8\" cy=\"350.0\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"387.8\" y=\"353.6\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">3</text><text x=\"400.8\" y=\"354.0\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Garosu-gil · pranzo</text><circle cx=\"254.4\" cy=\"163.6\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"254.4\" y=\"167.2\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">4</text><text x=\"267.4\" y=\"167.6\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Olive Young · duty free</text><circle cx=\"76.9\" cy=\"317.2\" r=\"9.5\" fill=\"#136E5E\"/><text x=\"76.9\" y=\"320.8\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"ui-monospace,monospace\">5</text><text x=\"89.9\" y=\"321.2\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1D2A26\" font-family=\"system-ui,sans-serif\" paint-order=\"stroke\" stroke=\"#F4F7F3\" stroke-width=\"3.5\">Cena e crociera sul Han</text></svg><div class=\"mapcap\">Itinerario del giorno · Seoul</div></div></div></div>\n      <div class=\"blk\"><span class=\"lab\">Mattina · dalle 10:00 · Apgujeong</span>\n        <p><strong>La Corea di fascia alta</strong>, quella che a Myeongdong non c'è: la mattina si va a Gangnam, dall'altra parte del fiume. Si parte da <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Dosan+Park+Seoul\" target=\"_blank\" rel=\"noopener\">Dosan Park</a>, 30 minuti di taxi dal Courtyard: i flagship di <strong>Gentle Monster</strong> (Haus Dosan), <strong>Tamburins</strong>, <strong>Ader Error</strong> e delle maison coreane, in edifici che sono gallerie prima che negozi. Poi <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Apgujeong+Rodeo+Street+Seoul\" target=\"_blank\" rel=\"noopener\">Apgujeong Rodeo</a> e la <a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Galleria+Department+Store+Apgujeong+Seoul\" target=\"_blank\" rel=\"noopener\">Galleria</a>, il grande magazzino del lusso, con il piano K-beauty premium: <strong>Sulwhasoo, Hera, Amorepacific</strong> nelle versioni che all'estero non arrivano.</p>\n        <p><em>Cosa portare</em>: passeggino. Gangnam è la Seul più piana e più larga.</p>\n      </div>\n      <div class=\"blk\"><span class=\"lab\">Pranzo · 12:30 · Garosu-gil</span>\n        <p><a class=\"l\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Garosu-gil+Seoul\" target=\"_blank\" rel=\"noopener\">Garosu-gil</a> — “la via degli alberi”, che
